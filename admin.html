<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — InkWell</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--text:#1a1a2e;--text-light:#64748b;--bg:#f8fafc;--border:#e2e8f0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-weight:600}
input,textarea,select{font-family:inherit;outline:none}

/* ══════════ LOGIN ══════════ */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:24px}
.login-box{background:#fff;border-radius:20px;padding:44px 36px;max-width:440px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.login-logo{font-size:32px;font-weight:800;text-align:center;margin-bottom:8px;color:#1a1a2e}
.login-logo span{color:var(--primary)}
.login-sub{text-align:center;color:var(--text-light);font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
.form-group input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px}
.form-group input:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border-radius:10px;font-size:15px;margin-top:8px}
.login-btn:hover:not(:disabled){background:var(--primary-dark)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:#fee;color:#c00;padding:12px;border-radius:8px;font-size:13.5px;margin-bottom:16px;display:none}
.login-error.show{display:block}
.login-footer{text-align:center;margin-top:20px;font-size:14px;color:var(--text-light)}
.login-footer a{color:var(--primary);cursor:pointer;font-weight:600}

/* ══════════ LAYOUT ══════════ */
.app{display:none;min-height:100vh}
.app.active{display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#1e293b;color:#fff;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:0 24px 24px;font-size:22px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand span{color:#818cf8}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:#94a3b8;font-weight:500;font-size:14.5px;transition:all .2s;cursor:pointer}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar nav a.active{background:var(--primary);color:#fff}
.sidebar nav a .ic{font-size:18px;width:22px;text-align:center}
.sidebar-footer{margin-top:auto;padding:20px 24px 0;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sidebar-user .av{width:36px;height:36px;background:var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.sidebar-user b{font-size:13.5px}
.sidebar-user span{font-size:11.5px;color:#94a3b8;display:block}
.logout-btn{width:100%;padding:10px;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:8px;font-size:13px}
.logout-btn:hover{background:rgba(239,68,68,.3);color:#fff}

.main{padding:32px 40px;overflow-y:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.topbar h1{font-size:28px}
.menu-btn{display:none;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px}

/* ══════════ SECTION (each route) ══════════ */
.section{display:none}
.section.active{display:block}

/* ══════════ STATS ══════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:32px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px}
.stat-card .label{font-size:13px;color:var(--text-light);font-weight:500;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800}
.stat-card .ic{float:right;font-size:26px;opacity:.5}

/* ══════════ CARDS & TABLES ══════════ */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.card-head h2{font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:#f8fafc}
td .title-cell{font-weight:600;display:block;margin-bottom:3px}
td .sub{font-size:12.5px;color:#94a3b8}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty-state{padding:60px;text-align:center;color:#94a3b8}
.loading{padding:60px;text-align:center;color:#94a3b8}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ══════════ EDITOR ══════════ */
.editor-grid{display:grid;grid-template-columns:1fr 320px;gap:24px}
.editor-main{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px}
.editor-side{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;height:fit-content;position:sticky;top:24px}
.editor-main input[type=text],.editor-main textarea,.editor-side input,.editor-side select,.editor-side textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;margin-bottom:14px;background:#fff;color:#1a1a2e}
.editor-main input.title-input{font-size:22px;font-weight:700;padding:16px;margin-bottom:16px}
.editor-main textarea{min-height:80px;resize:vertical}
#editor-container{min-height:400px;font-size:15px}
.ql-toolbar{border-radius:10px 10px 0 0;border-color:var(--border)!important;background:#f8fafc}
.ql-container{border-radius:0 0 10px 10px;border-color:var(--border)!important;font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;min-height:400px}
.ql-editor{min-height:400px}
.editor-side h3{font-size:15px;margin:20px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.editor-side h3:first-child{margin-top:0}
.editor-side label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
.cover-preview{margin-top:10px;border-radius:10px;overflow:hidden;display:none}
.cover-preview img{width:100%;display:block}
.cover-preview.show{display:block}
.upload-btn{padding:10px 16px;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block}
.upload-btn:hover{background:#e2e8f0}

/* ══════════ MODAL ══════════ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;place-items:center;padding:24px}
.modal-overlay.active{display:grid}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:22px;margin-bottom:20px}
.modal .close{float:right;font-size:24px;color:#94a3b8;background:none}
.modal label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.modal input,.modal textarea,.modal select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px}
.modal textarea{min-height:100px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ══════════ TOAST ══════════ */
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:900px){
  .app.active{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;z-index:100;transition:left .3s;width:260px}
  .sidebar.open{left:0}
  .main{padding:20px}
  .editor-grid{grid-template-columns:1fr}
  .editor-side{position:static}
  .menu-btn{display:inline-flex}
}
@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .stat-card .value{font-size:22px}
}
</style>
</head>
<body>

<!-- ══════════ LOGIN SCREEN ══════════ -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box" id="authBox"></div>
</div>

<!-- ══════════ APP ══════════ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Ink<span>Well</span> Admin</div>
    <nav>
      <a data-section="dashboard" class="active"><span class="ic">📊</span> Dashboard</a>
      <a data-section="posts"><span class="ic">📝</span> Posts</a>
      <a data-section="new-post"><span class="ic">➕</span> New Post</a>
      <a data-section="comments"><span class="ic">💬</span> Comments</a>
      <a data-section="categories"><span class="ic">📂</span> Categories</a>
      <a data-section="ads"><span class="ic">📢</span> Ads</a>
      <a data-section="subscribers"><span class="ic">📧</span> Subscribers</a>
      <a href="index.html" target="_blank"><span class="ic">🌐</span> View Site</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="av" id="sbAvatar">A</div>
        <div><b id="sbName">Admin</b><span id="sbRole">Publisher</span></div>
      </div>
      <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
  </aside>
  
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div id="topActions"></div>
    </div>
    
    <!-- SECTIONS (each is a route) -->
    <div id="section-dashboard" class="section active"></div>
    <div id="section-posts" class="section"></div>
    <div id="section-new-post" class="section"></div>
    <div id="section-comments" class="section"></div>
    <div id="section-categories" class="section"></div>
    <div id="section-ads" class="section"></div>
    <div id="section-subscribers" class="section"></div>
  </main>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  API_URL: 'https://gsssshilla.onrender.com/api/blog',
  UPLOAD_URL: 'https://gsssshilla.onrender.com'
};

let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let quill = null;
let editingPostId = null;
let coverUrl = '';
let coverPublicId = '';

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
const timeAgo = (d) => {
  if(!d) return '';
  const diff = Math.floor((new Date() - new Date(d))/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return formatDate(d);
};
const imgUrl = (p) => !p ? '' : (p.startsWith('http') ? p : CONFIG.UPLOAD_URL + p);

async function api(endpoint, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (options.body && !(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(CONFIG.API_URL + endpoint, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}

// ═══════════════════════════════════════════════════════════
// AUTH SECTION
// ═══════════════════════════════════════════════════════════
function renderLogin() {
  document.getElementById('authBox').innerHTML = `
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Sign in to your admin panel</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="admin@blog.com" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Your password" required></div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
    <div class="login-footer">Don't have an account? <a onclick="renderRegister()">Register</a></div>
  `;
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error || 'Login failed');
      token = data.token; currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      initApp();
    } catch(e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Sign In';
    }
  };
}

function renderRegister() {
  document.getElementById('authBox').innerHTML = `
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Create your publisher account</p>
    <div class="login-error" id="regError"></div>
    <form id="regForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="John Doe" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" placeholder="you@example.com" required></div>
      <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="regPass" required minlength="6"></div>
      <button type="submit" class="login-btn" id="regBtn">Create Account</button>
    </form>
    <div class="login-footer">Already have an account? <a onclick="renderLogin()">Sign In</a></div>
  `;
  document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const err = document.getElementById('regError');
    btn.disabled = true; btn.textContent = 'Creating...';
    try {
      const res = await fetch(`${CONFIG.API_URL}/auth/register`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPass').value
        })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);
      token = data.token; currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      initApp();
    } catch(e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  };
}

// ═══════════════════════════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════════════════════════
function initApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('sbName').textContent = currentUser?.name || 'Admin';
  document.getElementById('sbAvatar').textContent = (currentUser?.name || 'A')[0].toUpperCase();
  document.getElementById('sbRole').textContent = currentUser?.role === 'admin' ? 'Administrator' : 'Publisher';
  showSection('dashboard');
}

if (token && currentUser) initApp(); else renderLogin();

// ═══════════════════════════════════════════════════════════
// SIDEBAR NAVIGATION
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.sidebar nav a[data-section]').forEach(a => {
  a.onclick = () => { showSection(a.dataset.section); document.getElementById('sidebar').classList.remove('open'); };
});
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');
document.getElementById('logoutBtn').onclick = () => {
  if(!confirm('Sign out?')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  location.reload();
};

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar nav a[data-section]').forEach(a => a.classList.toggle('active', a.dataset.section === name));
  document.getElementById('section-' + name).classList.add('active');
  document.getElementById('topActions').innerHTML = '';

  const titles = {
    dashboard: 'Dashboard', posts: 'All Posts', 'new-post': editingPostId ? 'Edit Post' : 'New Post',
    comments: 'Comments', categories: 'Categories', ads: 'Ads Manager', subscribers: 'Subscribers'
  };
  document.getElementById('pageTitle').textContent = titles[name] || 'Dashboard';

  switch(name) {
    case 'dashboard': loadDashboard(); break;
    case 'posts': loadPosts(); break;
    case 'new-post': loadEditor(); break;
    case 'comments': loadComments(); break;
    case 'categories': loadCategories(); break;
    case 'ads': loadAds(); break;
    case 'subscribers': loadSubscribers(); break;
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION: DASHBOARD
// ═══════════════════════════════════════════════════════════
async function loadDashboard() {
  const el = document.getElementById('section-dashboard');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  try {
    const s = await api('/stats');
    el.innerHTML = `
      <div class="stats">
        <div class="stat-card"><span class="ic">📝</span><div class="label">Total Posts</div><div class="value">${s.posts.total||0}</div></div>
        <div class="stat-card"><span class="ic">✅</span><div class="label">Published</div><div class="value">${s.posts.published||0}</div></div>
        <div class="stat-card"><span class="ic">📄</span><div class="label">Drafts</div><div class="value">${s.posts.drafts||0}</div></div>
        <div class="stat-card"><span class="ic">👁️</span><div class="label">Total Views</div><div class="value">${s.posts.total_views||0}</div></div>
        <div class="stat-card"><span class="ic">💬</span><div class="label">Comments</div><div class="value">${s.comments.total||0}</div></div>
        <div class="stat-card"><span class="ic">❤️</span><div class="label">Likes</div><div class="value">${s.likes||0}</div></div>
        <div class="stat-card"><span class="ic">📧</span><div class="label">Subscribers</div><div class="value">${s.subscribers||0}</div></div>
        <div class="stat-card"><span class="ic">📢</span><div class="label">Ad Impressions</div><div class="value">${s.ads?.impressions||0}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Quick Actions</h2></div>
        <div style="padding:22px;display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="showSection('new-post')">➕ Write New Post</button>
          <button class="btn btn-outline" onclick="showSection('comments')">💬 Moderate Comments</button>
          <button class="btn btn-outline" onclick="showSection('ads')">📢 Manage Ads</button>
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="empty-state">Failed: ${e.message}</div>`;
  }
}

// ═══════════════════════════════════════════════════════════
// SECTION: POSTS
// ═══════════════════════════════════════════════════════════
async function loadPosts() {
  const el = document.getElementById('section-posts');
  el.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  document.getElementById('topActions').innerHTML = `<button class="btn btn-primary" onclick="newPost()">➕ New Post</button>`;
  try {

            ${posts.map(p => `

                <td>${p.views||0}</td>

          </tbody>
        </table>
        </div>
      </div>
    `;
  } catch(e) { el.innerHTML = `<div class="empty-state">Failed: ${e.message}</div>`; }
}

// ═══════════════════════════════════════════════════════════
// SECTION: EDITOR (New/Edit Post)
// ═══════════════════════════════════════════════════════════
async function loadEditor() {
  const el = document.getElementById('section-new-post');
  document.getElementById('pageTitle').textContent = editingPostId ? 'Edit Post' : 'New Post';
  document.getElementById('topActions').innerHTML = `<button class="btn btn-primary" id="saveBtn">💾 Save</button>`;

  el.innerHTML = `
    <div class="editor-grid">
      <div class="editor-main">
        <input type="text" class="title-input" id="edTitle" placeholder="Post title...">
        <textarea id="edExcerpt" placeholder="Short excerpt (optional)..." style="min-height:80px"></textarea>
        <label style="font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px">Content</label>
        <div id="editor-container"></div>
      </div>
      <div class="editor-side">
        <h3>Publish</h3>
        <label>Status</label>
        <select id="edStatus"><option value="draft">Draft</option><option value="published">Published</option></select>
        <label>Category</label>
        <select id="edCategory"><option value="">— None —</option></select>
        <label style="display:flex;align-items:center;gap:8px;margin-top:14px">
          <input type="checkbox" id="edFeatured" style="width:auto;margin:0"> Featured
        </label>
        <h3>Cover Image</h3>
        <input type="file" id="edCoverFile" accept="image/*" style="display:none">
        <label for="edCoverFile" class="upload-btn">📷 Upload Cover</label>
        <div class="cover-preview" id="coverPreview"><img id="coverImg"></div>
        <h3>Tags</h3>
        <input type="text" id="edTags" placeholder="tag1, tag2, tag3">
        <h3>SEO</h3>
        <label>Meta Title</label>
        <input type="text" id="edMetaTitle">
        <label>Meta Description</label>
        <textarea id="edMetaDesc" style="min-height:70px"></textarea>
      </div>
    </div>
  `;

  // Init Quill
  if(quill) { quill = null; }
  quill = new Quill('#editor-container', {
    theme: 'snow',
    placeholder: 'Write your story...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        [{ 'align': [] }],
        ['clean']
      ]
    }
  });

  // Image handler
  quill.getModule('toolbar').addHandler('image', () => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.click();
    input.onchange = async () => {
      const file = input.files[0];
      if(!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(`${CONFIG.API_URL}/upload/content`, {
          method:'POST', headers:{'Authorization':`Bearer ${token}`}, body: fd
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error);
        const range = quill.getSelection(true);
        quill.insertEmbed(range.index, 'image', data.url);
      } catch(e) { alert('Upload failed: ' + e.message); }
    };
  });

  // Load categories
  try {
    const cats = await api('/categories');
    const sel = document.getElementById('edCategory');
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      sel.appendChild(o);
    });
  } catch {}

  // Load post if editing
  if(editingPostId) {
    try {
      const post = await api(`/posts/id/${editingPostId}`);
      document.getElementById('edTitle').value = post.title || '';
      document.getElementById('edExcerpt').value = post.excerpt || '';
      document.getElementById('edStatus').value = post.status || 'draft';
      document.getElementById('edCategory').value = post.category_id || '';
      document.getElementById('edFeatured').checked = !!post.featured;
      document.getElementById('edMetaTitle').value = post.meta_title || '';
      document.getElementById('edMetaDesc').value = post.meta_description || '';
      quill.root.innerHTML = post.content || '';
      if(post.tags?.length) document.getElementById('edTags').value = post.tags.map(t=>t.name).join(', ');
      if(post.cover_image) {
        coverUrl = post.cover_image;
        coverPublicId = post.cover_public_id || '';
        document.getElementById('coverImg').src = post.cover_image;
        document.getElementById('coverPreview').classList.add('show');
      }
    } catch(e) { toast('Failed to load post: ' + e.message, 'error'); }
  } else {
    coverUrl = ''; coverPublicId = '';
  }

  // Cover upload
  document.getElementById('edCoverFile').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch(`${CONFIG.API_URL}/upload/cover`, {
        method:'POST', headers:{'Authorization':`Bearer ${token}`}, body: fd
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);
      coverUrl = data.url;
      coverPublicId = data.public_id;
      document.getElementById('coverImg').src = data.url;
      document.getElementById('coverPreview').classList.add('show');
      toast('Cover uploaded','success');
    } catch(e) { toast('Upload failed: ' + e.message,'error'); }
  };

  document.getElementById('saveBtn').onclick = savePost;
}

async function savePost() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  const payload = {
    title: document.getElementById('edTitle').value.trim(),
    excerpt: document.getElementById('edExcerpt').value.trim(),
    content: quill.root.innerHTML,
    cover_image: coverUrl,
    cover_public_id: coverPublicId,
    category_id: document.getElementById('edCategory').value || null,
    status: document.getElementById('edStatus').value,
    featured: document.getElementById('edFeatured').checked,
    meta_title: document.getElementById('edMetaTitle').value.trim(),
    meta_description: document.getElementById('edMetaDesc').value.trim(),
    tags: document.getElementById('edTags').value.split(',').map(t=>t.trim()).filter(Boolean)
  };

  if(!payload.title || !payload.content || payload.content === '<p><br></p>') {
    toast('Title and content required','error');
    btn.disabled = false; btn.textContent = '💾 Save';
    return;
  }

  try {
    if(editingPostId) {
      await api(`/posts/${editingPostId}`, { method:'PUT', body: JSON.stringify(payload) });
      toast('Post updated ✅','success');
    } else {
      const r = await api('/posts', { method:'POST', body: JSON.stringify(payload) });
      toast('Post created ✅','success');
      editingPostId = r.id;
    }
  } catch(e) { toast(e.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '💾 Save'; }
}
