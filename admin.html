<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Author Studio — InkWell</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--text:#111827;--text-light:#6b7280;--text-mute:#9ca3af;--bg:#f9fafb;--border:#e5e7eb;--sidebar:#111827;--radius:14px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow-x:hidden}
body.locked{overflow:hidden}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-weight:600;background:none}
input,textarea,select{font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}

/* LOGIN */
.login-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#7c3aed,#1e1b4b);padding:20px;position:relative;overflow:hidden}
.login-screen::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(236,72,153,.35),transparent 70%);border-radius:50%}
.login-card{background:#fff;border-radius:20px;padding:36px 26px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.4);position:relative;z-index:1}
.login-logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;text-align:center;margin-bottom:6px;color:#111827}
.login-logo span{color:var(--primary)}
.login-sub{text-align:center;color:var(--text-light);font-size:13.5px;margin-bottom:26px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:#fff;color:var(--text);transition:border-color .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(79,70,229,.1)}
.field textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:#fff;color:var(--text);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;display:none;line-height:1.5}
.alert.show{display:block}
.alert-error{background:#fef2f2;color:#b91c1c;border-left:3px solid var(--danger)}
.alert-success{background:#ecfdf5;color:#065f46;border-left:3px solid var(--success)}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.login-footer{text-align:center;margin-top:16px;font-size:13px;color:var(--text-light)}

/* APP */
.app{display:none;min-height:100vh;min-height:100dvh}
.app.active{display:block}
.sidebar{background:var(--sidebar);color:#fff;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:250px;overflow-y:auto;z-index:100;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-brand .name{font-family:'Playfair Display',serif;font-size:20px;font-weight:900}
.sidebar-brand .name span{color:#818cf8}
.sidebar-brand .role{font-size:10.5px;font-weight:700;color:#a78bfa;letter-spacing:1.2px;text-transform:uppercase;margin-top:5px;background:rgba(167,139,250,.15);padding:3px 8px;border-radius:20px;display:inline-block}
.sidebar nav{padding:12px 0;flex:1}
.sidebar nav .group{padding:12px 20px 5px;font-size:10px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:1.2px}
.sidebar nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#9ca3af;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sidebar nav a:hover{background:rgba(255,255,255,.04);color:#fff}
.sidebar nav a.active{background:rgba(79,70,229,.2);color:#fff;border-left-color:#818cf8}
.sidebar nav a .ic{width:20px;text-align:center;font-size:15px;flex-shrink:0}
.sidebar nav a .badge-pill{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;min-width:20px;text-align:center}
.sidebar-footer{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sidebar-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#818cf8,#a855f7);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;border:2px solid rgba(129,140,248,.3)}
.sidebar-user .av img{width:100%;height:100%;object-fit:cover}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user b{display:block;font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user span{display:block;font-size:11px;color:#9ca3af}
.logout-btn{width:100%;padding:9px;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .15s}
.logout-btn:hover{background:rgba(239,68,68,.3);color:#fff}

.main{min-height:100vh;min-height:100dvh;padding:22px 28px 80px;margin-left:250px}
.mobile-bar{display:none;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);padding:11px 16px;align-items:center;justify-content:space-between;z-index:50;gap:12px}
.mobile-bar .menu-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);display:grid;place-items:center;font-size:17px;color:var(--primary)}
.mobile-bar .brand{font-family:'Playfair Display',serif;font-size:19px;font-weight:900}
.mobile-bar .brand span{color:var(--primary)}
.mobile-bar .badge{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:700}
.overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:99;backdrop-filter:blur(2px)}
.overlay.show{display:block}

.page-head{margin-bottom:20px}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.page-head .sub{color:var(--text-light);font-size:13.5px;margin-top:3px}
.page-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.section{display:none;animation:fadeIn .25s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:17px;transition:all .2s;cursor:pointer}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,70,229,.08);border-color:#c7d2fe}
.stat .lbl{font-size:12px;color:var(--text-light);font-weight:500;margin-bottom:6px}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-.5px}
.stat.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none}
.stat.primary .lbl{color:rgba(255,255,255,.85)}
.stat.primary .val{color:#fff}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.card-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:15.5px;font-weight:700}
.card-head .count{font-size:12.5px;color:var(--text-mute);font-weight:500}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #f3f4f6;vertical-align:middle}
th{background:#fafbfc;font-weight:600;font-size:11px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafbfc}
.title-cell{font-weight:600;display:block;margin-bottom:2px;color:var(--text);line-height:1.3}
.sub-cell{font-size:11.5px;color:var(--text-mute)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#e0e7ff;color:#3730a3}
.row-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:50px 20px;text-align:center;color:var(--text-light)}
.empty .icon{font-size:44px;opacity:.35;margin-bottom:10px}
.empty h3{font-size:15.5px;font-weight:700;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px;margin-bottom:16px}
.loader{padding:50px;text-align:center;color:var(--text-light)}
.spinner{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* EDITOR */
.editor-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.editor-top{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbfc}
.publish-btn{background:var(--success);color:#fff;padding:11px 24px;font-size:14.5px;font-weight:700;border-radius:10px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 10px rgba(16,185,129,.3)}
.publish-btn:hover:not(:disabled){background:#059669;transform:translateY(-1px)}
.publish-btn:disabled{opacity:.6;cursor:not-allowed}
.editor-grid{display:grid;grid-template-columns:1fr 320px}
.editor-main{padding:24px 28px}
.editor-side{padding:20px;background:#fafbfc;border-left:1px solid var(--border)}
.editor-title{width:100%;font-family:'Playfair Display',serif;font-size:26px;font-weight:700;padding:6px 0;border:none;border-bottom:2px solid var(--border);margin-bottom:14px;background:transparent}
.editor-title:focus{border-bottom-color:var(--primary);outline:none}
.editor-title::placeholder{color:#d1d5db}
.editor-excerpt{width:100%;padding:10px 0;border:none;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-light);margin-bottom:16px;background:transparent;resize:none;font-family:inherit}
.editor-excerpt:focus{border-bottom-color:var(--primary);outline:none}
#quill-editor{min-height:400px;font-size:15.5px}
.ql-toolbar{border:1px solid var(--border)!important;border-radius:10px 10px 0 0!important;background:#fff}
.ql-container{border:1px solid var(--border)!important;border-top:none!important;border-radius:0 0 10px 10px!important;font-family:'Inter',sans-serif;font-size:15.5px;min-height:400px;background:#fff}
.ql-editor{min-height:400px;padding:16px}
.side-block{margin-bottom:20px}
.side-block h3{font-size:11.5px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.cover-upload{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:#fff;transition:all .15s}
.cover-upload:hover{border-color:var(--primary);background:#f5f3ff}
.cover-upload .ic{font-size:22px;margin-bottom:4px}
.cover-upload .txt{font-size:12.5px;color:var(--text-light)}
.cover-preview{margin-top:10px;border-radius:9px;overflow:hidden;display:none;border:1px solid var(--border)}
.cover-preview.show{display:block}
.cover-preview img{width:100%;display:block}
.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:6px 0}
.check-row input{width:18px;height:18px;margin:0;accent-color:var(--primary)}

/* PROFILE */
.profile-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:18px}
.profile-top{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.profile-avatar{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#a855f7);display:grid;place-items:center;color:#fff;font-size:36px;font-weight:700;overflow:hidden;margin:0 auto 10px}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-fields{flex:1;min-width:250px}

.modal-bg{display:none;position:fixed;inset:0;background:rgba(17,24,39,.6);z-index:1000;align-items:center;justify-content:center;padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.modal-bg.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h2{font-size:17px;font-weight:700}
.modal-head .close{width:32px;height:32px;border-radius:9px;background:#f3f4f6;display:grid;place-items:center;font-size:15px;color:var(--text-light)}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.toast{position:fixed;bottom:24px;left:24px;right:24px;max-width:400px;margin-left:auto;background:#111827;color:#fff;padding:13px 18px;border-radius:12px;font-size:13.5px;font-weight:500;z-index:2000;transform:translateY(120px);opacity:0;transition:all .3s;box-shadow:0 15px 40px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .main{margin-left:0;padding:0 16px 100px}
  .mobile-bar{display:flex}
  .page-head{padding:18px 0 0}
  .page-head h1{font-size:21px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:14px}
  .stat .val{font-size:22px}
  th,td{padding:11px 14px;font-size:12.5px}
  .editor-grid{grid-template-columns:1fr}
  .editor-side{border-left:none;border-top:1px solid var(--border)}
  .editor-main{padding:18px}
  .editor-title{font-size:22px}
}
@media(max-width:640px){
  .main{padding:0 12px 100px}
  .mobile-bar{padding:10px 12px}
  .stats{gap:8px}
  .stat{padding:12px}
  .stat .lbl{font-size:11.5px}
  .stat .val{font-size:20px}
  .card{border-radius:12px}
  .row-actions{flex-direction:column;align-items:stretch}
  .row-actions .btn{width:100%}
  .publish-btn{padding:10px 18px;font-size:13.5px}
  .btn{padding:10px 14px;font-size:13px}
  .btn-sm{padding:6px 10px;font-size:12px}
  .toast{left:12px;right:12px;bottom:12px;padding:12px 14px;font-size:13px}
  .editor-title{font-size:20px}
  .ql-editor{min-height:300px}
  .table-wrap{margin:0 -16px}
  table{min-width:480px}
  .modal-actions{flex-direction:column-reverse}
  .modal-actions .btn{width:100%}
  .profile-top{flex-direction:column;align-items:center;text-align:center}
  .profile-avatar{width:80px;height:80px;font-size:30px}
}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Author Studio</p>
    <div class="alert alert-error" id="loginError"></div>
    <div class="alert alert-success" id="loginSuccess"></div>
    <div id="authFormContainer"></div>
  </div>
</div>

<div class="app" id="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="name">Ink<span>Well</span></div>
      <div class="role">Author Studio</div>
    </div>
    <nav id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="av" id="sbAv">A</div>
        <div class="info">
          <b id="sbName">Author</b>
          <span id="sbRole">Author</span>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </aside>
  <div class="mobile-bar">
    <button class="menu-icon" onclick="toggleSidebar()">☰</button>
    <div class="brand">Ink<span>Well</span></div>
    <div class="badge">✍️ Author</div>
  </div>
  <main class="main">
    <div id="pageHeader"></div>
    <div id="sec-dashboard" class="section"></div>
    <div id="sec-posts" class="section"></div>
    <div id="sec-editor" class="section"></div>
    <div id="sec-comments" class="section"></div>
    <div id="sec-profile" class="section"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
const CONFIG = {
  API_URL: 'https://gsssshilla.onrender.com/api/blog',
  UPLOAD_URL: 'https://gsssshilla.onrender.com'
};

let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let quill = null;
let editingPostId = null;
let coverUrl = '';
let coverPublicId = '';

const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const timeAgo = (d) => {
  if (!d) return '';
  const diff = Math.floor((new Date() - new Date(d)) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return fmtDate(d);
};
const imgUrl = (p) => !p ? '' : (p.startsWith('http') ? p : CONFIG.UPLOAD_URL + p);

async function api(endpoint, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(CONFIG.API_URL + endpoint, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  const icons = { success: '✓', error: '✕', '': 'ℹ' };
  t.innerHTML = `<span style="font-size:16px">${icons[type]||'ℹ'}</span> <span>${esc(msg)}</span>`;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast ' + type, 3000);
}

// AUTH FORMS
function renderLogin() {
  document.getElementById('authFormContainer').innerHTML = `
    <div class="alert alert-error" id="authError"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
    </form>
    <div class="login-footer">
      <span class="link" onclick="renderRegister()">Create account</span>
      &nbsp;·&nbsp;
      <span class="link" onclick="renderForgot()">Forgot?</span>
    </div>
  `;
  document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('authError');
    err.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing in...';
    try {
      const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      token = data.token;
      currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));

      // Check role
      if (data.user.role === 'admin') {
        alert('You are Super Admin — redirecting to Super Admin panel');
        location.href = 'superadmin.html';
        return;
      }

async function savePost(actionStatus) {
  const publishBtn = document.getElementById('publishBtn');
  const draftBtn = document.getElementById('saveDraftBtn');

  const title = document.getElementById('edTitle').value.trim();
  const content = quill.root.innerHTML;
  const isEmptyContent = !content || content === '<p><br></p>' || content.replace(/<[^>]+>/g,'').trim() === '';

  if (!title) { toast('Please add a title', 'error'); document.getElementById('edTitle').focus(); return; }
  if (isEmptyContent) { toast('Please write some content', 'error'); quill.focus(); return; }

  if (publishBtn) { publishBtn.disabled = true; publishBtn.textContent = 'Publishing...'; }
  if (draftBtn) { draftBtn.disabled = true; draftBtn.textContent = 'Saving...'; }

  const payload = {
    title, excerpt: document.getElementById('edExcerpt').value.trim(),
    content, cover_image: coverUrl, cover_public_id: coverPublicId,
    category_id: document.getElementById('edCategory').value || null,
    status: actionStatus || document.getElementById('edStatus').value,
    featured: document.getElementById('edFeatured').checked,
    meta_title: document.getElementById('edMetaTitle').value.trim() || title,
    meta_description: document.getElementById('edMetaDesc').value.trim(),
    tags: document.getElementById('edTags').value.split(',').map(t=>t.trim()).filter(Boolean)
  };

  try {
    const hasValidId = editingPostId && Number(editingPostId) > 0;
    if (hasValidId) {
      try {
        await api(`/posts/${editingPostId}`, { method: 'PUT', body: JSON.stringify(payload) });
        toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
      } catch(putErr) {
        const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
        editingPostId = r.id;
        toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
      }
    } else {
      const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
      editingPostId = r.id;
      toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
    }
    setTimeout(() => { editingPostId = null; show('posts'); }, 900);
  } catch(e) {
    toast(e.message || 'Save failed', 'error');
    if (publishBtn) { publishBtn.disabled = false; publishBtn.textContent = '🚀 Publish'; }
    if (draftBtn) { draftBtn.disabled = false; draftBtn.textContent = '💾 Save Draft'; }
  }
}

      } catch(e) { toast(e.message, 'error'); }
    };
  } catch(e) { el.innerHTML = `<div class="empty"><div class="icon">⚠️</div><h3>Failed</h3><p>${esc(e.message)}</p></div>`; }
}

async function saveProfile() {
  try {
    await api('/auth/profile', { method:'PUT', body: JSON.stringify({
      name: document.getElementById('pfName').value,
      bio: document.getElementById('pfBio').value,
      website: document.getElementById('pfWebsite').value
    })});
    currentUser.name = document.getElementById('pfName').value;
    localStorage.setItem('user', JSON.stringify(currentUser));
    document.getElementById('sbName').textContent = currentUser.name;
    toast('Profile saved ✅', 'success');
  } catch(e) { toast(e.message, 'error'); }
}

function closeModal() { document.getElementById('modalBg').classList.remove('active'); }
document.getElementById('modalBg').onclick = (e) => { if (e.target.id === 'modalBg') closeModal(); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

window.renderLogin = renderLogin;
window.renderRegister = renderRegister;
window.renderForgot = renderForgot;
window.logout = logout;
window.toggleSidebar = toggleSidebar;
window.show = show;
window.startNew = startNew;
window.editPost = editPost;
window.deletePost = deletePost;
window.setCmt = setCmt;
window.delCmt = delCmt;
window.saveProfile = saveProfile;
window.closeModal = closeModal;
</script>
