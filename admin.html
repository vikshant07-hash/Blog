<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — InkWell</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;
  --primary-dark:#4338ca;
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --text:#111827;
  --text-light:#6b7280;
  --bg:#f9fafb;
  --bg-card:#ffffff;
  --border:#e5e7eb;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-weight:600}
input,textarea,select{font-family:inherit;outline:none}

/* ═══════════ LOGIN ═══════════ */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f6;padding:24px}
.login-card{background:#fff;border-radius:16px;padding:40px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.08);border:1px solid var(--border)}
.login-logo{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;text-align:center;margin-bottom:6px}
.login-logo span{color:var(--primary)}
.login-sub{text-align:center;color:var(--text-light);font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.field input,.field textarea,.field select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:9px;font-size:14px;background:#fff;color:var(--text);transition:border .15s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:9px;font-size:14px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-lg{padding:14px 28px;font-size:15px}
.btn-block{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.error-msg{background:#fef2f2;color:#b91c1c;padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.error-msg.show{display:block}

/* ═══════════ APP LAYOUT ═══════════ */
.app{display:none;min-height:100vh;grid-template-columns:240px 1fr}
.app.active{display:grid}
.sidebar{background:#111827;color:#fff;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.sidebar-brand{padding:0 20px 20px;font-family:'Playfair Display',serif;font-size:20px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.sidebar-brand span{color:#818cf8}
.sidebar nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#9ca3af;font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.sidebar nav a:hover{background:rgba(255,255,255,.04);color:#fff}
.sidebar nav a.active{background:rgba(79,70,229,.15);color:#fff;border-left-color:#818cf8}
.sidebar nav a .ic{width:18px;text-align:center;font-size:16px}
.sidebar-bottom{margin-top:auto;padding:16px 20px 0;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-user{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.sidebar-user .av{width:32px;height:32px;background:var(--primary);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.sidebar-user b{display:block;font-size:13px}
.sidebar-user span{font-size:11px;color:#9ca3af}
.logout-btn{width:100%;padding:9px;background:rgba(239,68,68,.15);color:#fca5a5;border-radius:8px;font-size:13px;font-weight:600;transition:all .15s}
.logout-btn:hover{background:rgba(239,68,68,.3);color:#fff}

.main{padding:28px 36px;overflow-y:auto}
.main-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.main-head h1{font-size:24px;font-weight:700}
.main-head .sub{color:var(--text-light);font-size:13.5px;margin-top:2px}
.menu-btn{display:none;background:var(--primary);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px}

/* ═══════════ SECTIONS ═══════════ */
.section{display:none}
.section.active{display:block}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px}
.stat .lbl{font-size:12.5px;color:var(--text-light);font-weight:500;margin-bottom:4px}
.stat .val{font-size:24px;font-weight:700;color:var(--text)}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.card-head h2{font-size:16px;font-weight:700}
.card-body{padding:20px}

/* TABLES */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #f3f4f6}
th{background:#f9fafb;font-weight:600;font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.title-cell{font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.sub{font-size:12px;color:var(--text-light)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:50px 20px;text-align:center;color:var(--text-light)}
.loader{padding:50px;text-align:center;color:var(--text-light)}
.spinner{width:32px;height:32px;border:3px solid #e5e7eb;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════ EDITOR — KING ═══════════ */
.editor-wrap{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.editor-top{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#f9fafb}
.editor-top .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editor-top .right{display:flex;gap:8px;flex-wrap:wrap}
.publish-btn{background:var(--success);color:#fff;padding:12px 28px;font-size:15px;font-weight:700;border-radius:10px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(16,185,129,.3);transition:all .15s}
.publish-btn:hover:not(:disabled){background:#059669;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.4)}
.publish-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

.editor-grid{display:grid;grid-template-columns:1fr 320px}
.editor-main{padding:28px 32px;border-right:1px solid var(--border)}
.editor-side{padding:24px;background:#fafbfc}
.editor-title{width:100%;font-family:'Playfair Display',serif;font-size:32px;font-weight:700;padding:8px 0;border:none;border-bottom:2px solid var(--border);color:var(--text);margin-bottom:20px;background:transparent}
.editor-title:focus{border-bottom-color:var(--primary)}
.editor-title::placeholder{color:#d1d5db}
.editor-excerpt{width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--border);font-size:15px;color:var(--text-light);margin-bottom:20px;background:transparent;resize:none;font-family:inherit}
.editor-excerpt:focus{border-bottom-color:var(--primary);outline:none}
.editor-excerpt::placeholder{color:#d1d5db}
#quill-editor{min-height:420px;font-size:16px;line-height:1.7}
.ql-toolbar{border:1px solid var(--border)!important;border-radius:9px 9px 0 0!important;background:#fff}
.ql-container{border:1px solid var(--border)!important;border-top:none!important;border-radius:0 0 9px 9px!important;font-family:'Inter',sans-serif;font-size:16px;min-height:420px;background:#fff}
.ql-editor{min-height:420px;padding:18px}

.side-block{margin-bottom:22px}
.side-block h3{font-size:12px;font-weight:700;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.side-block .field{margin-bottom:12px}
.cover-upload{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .15s;background:#fff}
.cover-upload:hover{border-color:var(--primary);background:#f5f3ff}
.cover-upload .ic{font-size:24px;margin-bottom:6px}
.cover-upload .txt{font-size:13px;color:var(--text-light);font-weight:500}
.cover-preview{margin-top:10px;border-radius:9px;overflow:hidden;display:none;border:1px solid var(--border)}
.cover-preview.show{display:block}
.cover-preview img{width:100%;display:block}

.check-row{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.check-row input{width:auto;margin:0}

/* ═══════════ MODAL ═══════════ */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:#fff;border-radius:14px;padding:28px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:19px;margin-bottom:18px}
.modal .close{float:right;font-size:22px;color:var(--text-light);background:none;padding:0;line-height:1}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ═══════════ TOAST ═══════════ */
.toast{position:fixed;bottom:24px;right:24px;background:#111827;color:#fff;padding:14px 22px;border-radius:10px;font-size:14px;font-weight:500;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* ═══════════ RESPONSIVE ═══════════ */
@media(max-width:960px){
  .app.active{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-240px;z-index:100;transition:left .25s;width:240px}
  .sidebar.open{left:0}
  .main{padding:20px}
  .editor-grid{grid-template-columns:1fr}
  .editor-main{border-right:none;border-bottom:1px solid var(--border);padding:20px}
  .editor-side{padding:20px}
  .menu-btn{display:inline-flex}
  .editor-title{font-size:24px}
}
@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  .publish-btn{padding:11px 20px;font-size:14px}
  th,td{padding:10px 12px;font-size:13px}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Sign in to admin panel</p>
    <div class="error-msg" id="loginError"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="admin@blog.com" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" placeholder="Your password" required></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
    </form>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">Ink<span>Well</span></div>
    <nav>
      <a data-sec="dashboard" class="active"><span class="ic">📊</span> Dashboard</a>
      <a data-sec="posts"><span class="ic">📝</span> Posts</a>
      <a data-sec="editor"><span class="ic">✏️</span> Write</a>
      <a data-sec="comments"><span class="ic">💬</span> Comments</a>
      <a data-sec="categories"><span class="ic">📁</span> Categories</a>
      <a data-sec="ads"><span class="ic">📢</span> Ads</a>
      <a data-sec="subscribers"><span class="ic">✉️</span> Subscribers</a>
      <a href="index.html" target="_blank"><span class="ic">🌐</span> View Site</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-user">
        <div class="av" id="sbAv">A</div>
        <div><b id="sbName">Admin</b><span id="sbRole">Publisher</span></div>
      </div>
      <button class="logout-btn" id="logoutBtn">Sign Out</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p class="sub" id="pageSub">Overview of your blog</p>
        </div>
      </div>
      <div id="topActions"></div>
    </div>

    <div id="sec-dashboard" class="section active"></div>
    <div id="sec-posts" class="section"></div>
    <div id="sec-editor" class="section"></div>
    <div id="sec-comments" class="section"></div>
    <div id="sec-categories" class="section"></div>
    <div id="sec-ads" class="section"></div>
    <div id="sec-subscribers" class="section"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const CONFIG = {
  API_URL: 'https://gsssshilla.onrender.com/api/blog',
  UPLOAD_URL: 'https://gsssshilla.onrender.com'
};

let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');
let quill = null;
let editingPostId = null;
let coverUrl = '';
let coverPublicId = '';

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const esc = (s) => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
const timeAgo = (d) => {
  if(!d) return '';
  const diff = Math.floor((new Date() - new Date(d))/1000);
  if(diff<60) return 'just now';
  if(diff<3600) return Math.floor(diff/60)+'m ago';
  if(diff<86400) return Math.floor(diff/3600)+'h ago';
  if(diff<604800) return Math.floor(diff/86400)+'d ago';
  return fmtDate(d);
};
const imgUrl = (p) => !p ? '' : (p.startsWith('http') ? p : CONFIG.UPLOAD_URL + p);

async function api(endpoint, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.body && !(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(CONFIG.API_URL + endpoint, { ...opts, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}

// ═══════════════════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════════════════
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(currentUser));
    initApp();
  } catch(e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

function initApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('sbName').textContent = currentUser?.name || 'Admin';
  document.getElementById('sbAv').textContent = (currentUser?.name || 'A')[0].toUpperCase();
  document.getElementById('sbRole').textContent = currentUser?.role === 'admin' ? 'Administrator' : 'Publisher';
  show('dashboard');
}

if (token && currentUser) initApp();

document.getElementById('logoutBtn').onclick = () => {
  if(!confirm('Sign out?')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  location.reload();
};

// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.sidebar nav a[data-sec]').forEach(a => {
  a.onclick = () => { show(a.dataset.sec); document.getElementById('sidebar').classList.remove('open'); };
});
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

function show(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar nav a[data-sec]').forEach(a => a.classList.toggle('active', a.dataset.sec === name));
  document.getElementById('sec-' + name).classList.add('active');
  document.getElementById('topActions').innerHTML = '';

  const titles = {
    dashboard: ['Dashboard', 'Overview of your blog'],
    posts: ['Posts', 'Manage your articles'],
    editor: [editingPostId ? 'Edit Post' : 'Write Post', 'Compose your story'],
    comments: ['Comments', 'Moderate discussions'],
    categories: ['Categories', 'Organize content'],
    ads: ['Ads', 'Monetization slots'],
    subscribers: ['Subscribers', 'Newsletter audience']
  };
  const [t, s] = titles[name] || ['Dashboard', ''];
  document.getElementById('pageTitle').textContent = t;
  document.getElementById('pageSub').textContent = s;

  switch(name) {
    case 'dashboard': loadDashboard(); break;
    case 'posts': loadPosts(); break;
    case 'editor': loadEditor(); break;
    case 'comments': loadComments(); break;
    case 'categories': loadCategories(); break;
    case 'ads': loadAds(); break;
    case 'subscribers': loadSubscribers(); break;
  }
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════════
async function loadDashboard() {
  const el = document.getElementById('sec-dashboard');
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Loading...</div>';
  try {
    const s = await api('/stats');
    el.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="lbl">Total Posts</div><div class="val">${s.posts.total||0}</div></div>
        <div class="stat"><div class="lbl">Published</div><div class="val">${s.posts.published||0}</div></div>
        <div class="stat"><div class="lbl">Drafts</div><div class="val">${s.posts.drafts||0}</div></div>
        <div class="stat"><div class="lbl">Total Views</div><div class="val">${(s.posts.total_views||0).toLocaleString()}</div></div>
        <div class="stat"><div class="lbl">Comments</div><div class="val">${s.comments.total||0}</div></div>
        <div class="stat"><div class="lbl">Likes</div><div class="val">${s.likes||0}</div></div>
        <div class="stat"><div class="lbl">Subscribers</div><div class="val">${s.subscribers||0}</div></div>
        <div class="stat"><div class="lbl">Ad Views</div><div class="val">${s.ads?.impressions||0}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Quick Actions</h2></div>
        <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="startNew()">✏️ Write New Post</button>
          <button class="btn btn-outline" onclick="show('comments')">💬 Comments</button>
          <button class="btn btn-outline" onclick="show('ads')">📢 Ads</button>
        </div>
      </div>
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Failed: ${e.message}</div>`; }
}

// ═══════════════════════════════════════════════════════════
// POSTS LIST
// ═══════════════════════════════════════════════════════════
async function loadPosts() {
  const el = document.getElementById('sec-posts');
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Loading...</div>';
  document.getElementById('topActions').innerHTML = `<button class="btn btn-primary" onclick="startNew()">+ New Post</button>`;
  try {
    const posts = await api('/posts/admin/all');
    if(!posts.length) {
      el.innerHTML = `<div class="card"><div class="empty">
        <p style="font-size:16px;margin-bottom:14px">No posts yet.</p>
        <button class="btn btn-primary" onclick="startNew()">Write Your First Post</button>

      return;
    }
    el.innerHTML = `
      <div class="card">
        <div class="card-head"><h2>All Posts (${posts.length})</h2></div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Views</th><th>Date</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody>
            ${posts.map(p => `
              <tr>
                <td><span class="title-cell">${esc(p.title)}</span><span class="sub">by ${esc(p.author_name||'Unknown')}</span></td>
                <td>${esc(p.category_name||'—')}</td>
                <td><span class="badge ${p.status==='published'?'badge-success':'badge-warning'}">${p.status}</span></td>
                <td>${p.views||0}</td>
                <td class="sub">${timeAgo(p.created_at)}</td>
                <td style="text-align:right">
                  <div class="row-actions" style="justify-content:flex-end">
                    <button class="btn btn-outline btn-sm" onclick="editPost(${p.id})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  } catch(e) { el.innerHTML = `<div class="empty">Failed: ${e.message}</div>`; }
}

function startNew() {
  editingPostId = null;
  coverUrl = '';
  coverPublicId = '';
  show('editor');
}

function editPost(id) {
  editingPostId = id;
  coverUrl = '';
  coverPublicId = '';
  show('editor');
}

async function deletePost(id) {
  if(!confirm('Delete this post permanently?')) return;
  try {
    await api(`/posts/${id}`, { method: 'DELETE' });

  } catch(e) { toast(e.message, 'error'); }
}

// ═══════════════════════════════════════════════════════════
// EDITOR — with PUBLISH button
// ═══════════════════════════════════════════════════════════
async function loadEditor() {
  const el = document.getElementById('sec-editor');
  
  // Reset if new post
  if (!editingPostId) {
    coverUrl = '';
    coverPublicId = '';
  }

  // Top action = Publish button
  document.getElementById('topActions').innerHTML = `
    <button class="publish-btn" id="publishBtn">🚀 Publish</button>
  `;

  el.innerHTML = `
    <div class="editor-wrap">
      <div class="editor-top">
        <div class="left">
          <button class="btn btn-outline btn-sm" onclick="show('posts')">← Back to Posts</button>
          <span style="color:var(--text-light);font-size:13px" id="edStatusLabel">
            ${editingPostId ? 'Editing existing post' : 'Draft mode'}
          </span>
        </div>
        <div class="right">
          <button class="btn btn-outline btn-sm" id="saveDraftBtn">💾 Save Draft</button>
        </div>
      </div>
      
      <div class="editor-grid">
        <div class="editor-main">
          <input type="text" class="editor-title" id="edTitle" placeholder="Enter your title...">
          <textarea class="editor-excerpt" id="edExcerpt" placeholder="Write a short excerpt (optional)..." rows="1"></textarea>
          <div id="quill-editor"></div>
        </div>
        
        <div class="editor-side">
          <div class="side-block">
            <h3>Publish Settings</h3>
            <div class="field">
              <label>Status</label>
              <select id="edStatus">
                <option value="draft">Draft</option>
                <option value="published" selected>Published</option>
              </select>
            </div>
            <div class="field">
              <label>Category</label>
              <select id="edCategory"><option value="">— None —</option></select>
            </div>
            <label class="check-row">
              <input type="checkbox" id="edFeatured"> Feature on homepage
            </label>
          </div>

          <div class="side-block">
            <h3>Cover Image</h3>
            <input type="file" id="edCoverFile" accept="image/*" style="display:none">
            <div class="cover-upload" onclick="document.getElementById('edCoverFile').click()">
              <div class="ic">🖼️</div>
              <div class="txt">Click to upload cover</div>
            </div>
            <div class="cover-preview" id="coverPreview"><img id="coverImg"></div>
          </div>

          <div class="side-block">
            <h3>Tags</h3>
            <div class="field">
              <input type="text" id="edTags" placeholder="tech, design, ai">
            </div>
          </div>

          <div class="side-block">
            <h3>SEO</h3>
            <div class="field">
              <label>Meta Title</label>
              <input type="text" id="edMetaTitle" placeholder="SEO friendly title">
            </div>
            <div class="field">
              <label>Meta Description</label>
              <textarea id="edMetaDesc" rows="3" placeholder="Short description for search engines"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Init Quill
  if (quill) { quill = null; }
  quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Write your story here...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        [{ 'align': [] }],
        ['clean']
      ]
    }
  });

  // Image handler
  quill.getModule('toolbar').addHandler('image', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.click();
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      toast('Uploading image...');
      try {
        const res = await fetch(`${CONFIG.API_URL}/upload/content`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: fd
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const range = quill.getSelection(true);
        quill.insertEmbed(range.index, 'image', data.url);
        toast('Image inserted', 'success');
      } catch(e) { toast('Failed: ' + e.message, 'error'); }
    };
  });

  // Load categories
  try {
    const cats = await api('/categories');
    const sel = document.getElementById('edCategory');
    cats.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id;
      o.textContent = c.name;
      sel.appendChild(o);
    });
  } catch {}

  // Load existing post
  if (editingPostId) {
    try {
      const post = await api(`/posts/id/${editingPostId}`);
      document.getElementById('edTitle').value = post.title || '';
      document.getElementById('edExcerpt').value = post.excerpt || '';
      document.getElementById('edStatus').value = post.status || 'draft';
      document.getElementById('edCategory').value = post.category_id || '';
      document.getElementById('edFeatured').checked = !!post.featured;
      document.getElementById('edMetaTitle').value = post.meta_title || '';
      document.getElementById('edMetaDesc').value = post.meta_description || '';
      quill.root.innerHTML = post.content || '';
      if (post.tags?.length) document.getElementById('edTags').value = post.tags.map(t => t.name).join(', ');
      if (post.cover_image) {
        coverUrl = post.cover_image;
        coverPublicId = post.cover_public_id || '';
        document.getElementById('coverImg').src = post.cover_image;
        document.getElementById('coverPreview').classList.add('show');
      }
    } catch(e) { toast('Failed to load: ' + e.message, 'error'); }
  }

  // Cover upload
  document.getElementById('edCoverFile').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('file', file);
    toast('Uploading cover...');
    try {
      const res = await fetch(`${CONFIG.API_URL}/upload/cover`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: fd
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      coverUrl = data.url;
      coverPublicId = data.public_id;
      document.getElementById('coverImg').src = data.url;
      document.getElementById('coverPreview').classList.add('show');
      toast('Cover uploaded', 'success');
    } catch(e) { toast('Upload failed: ' + e.message, 'error'); }
  };

  // Publish button
  document.getElementById('publishBtn').onclick = () => savePost('published');
  // Save draft button
  document.getElementById('saveDraftBtn').onclick = () => savePost('draft');
}

// ═══════════════════════════════════════════════════════════
// SAVE POST — Core function
// ═══════════════════════════════════════════════════════════
async function savePost(actionStatus) {
  const publishBtn = document.getElementById('publishBtn');
  const draftBtn = document.getElementById('saveDraftBtn');
  
  // Validation
  const title = document.getElementById('edTitle').value.trim();
  const content = quill.root.innerHTML;
  const isEmptyContent = !content || content === '<p><br></p>' || content.replace(/<[^>]+>/g,'').trim() === '';

  if (!title) {
    toast('Please add a title', 'error');
    document.getElementById('edTitle').focus();
    return;
  }
  if (isEmptyContent) {
    toast('Please write some content', 'error');
    quill.focus();
    return;
  }

  // Disable buttons
  if (publishBtn) { publishBtn.disabled = true; publishBtn.textContent = 'Publishing...'; }
  if (draftBtn) { draftBtn.disabled = true; draftBtn.textContent = 'Saving...'; }

  const payload = {
    title: title,
    excerpt: document.getElementById('edExcerpt').value.trim(),
    content: content,
    cover_image: coverUrl,
    cover_public_id: coverPublicId,
    category_id: document.getElementById('edCategory').value || null,
    status: actionStatus || document.getElementById('edStatus').value,
    featured: document.getElementById('edFeatured').checked,
    meta_title: document.getElementById('edMetaTitle').value.trim() || title,
    meta_description: document.getElementById('edMetaDesc').value.trim() || document.getElementById('edExcerpt').value.trim(),
    tags: document.getElementById('edTags').value.split(',').map(t=>t.trim()).filter(Boolean)
  };

  try {
    const hasValidId = editingPostId && editingPostId !== 'null' && editingPostId !== 'undefined' && Number(editingPostId) > 0;

    if (hasValidId) {
      // Try update
      try {
        await api(`/posts/${editingPostId}`, { method: 'PUT', body: JSON.stringify(payload) });
        toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
      } catch(putErr) {
        // If update fails, create new
        console.warn('Update failed, creating new post:', putErr.message);
        const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
        editingPostId = r.id;
        toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
      }
    } else {
      // Create new
      const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
      editingPostId = r.id;
      toast(actionStatus === 'published' ? 'Published! ✅' : 'Draft saved ✅', 'success');
      document.getElementById('edStatusLabel').textContent = 'Editing existing post';
    }

    // Redirect to posts list after 1 second
    setTimeout(() => {
      editingPostId = null;
      show('posts');
    }, 900);

  } catch(e) {
    toast(e.message || 'Save failed', 'error');
    if (publishBtn) { publishBtn.disabled = false; publishBtn.textContent = '🚀 Publish'; }
    if (draftBtn) { draftBtn.disabled = false; draftBtn.textContent = '💾 Save Draft'; }
  }
}
