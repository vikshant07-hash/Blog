<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — InkWell</title>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--text:#1a1a2e;--text-light:#64748b;--bg:#f8fafc;--bg-card:#fff;--border:#e2e8f0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,textarea,select{font-family:inherit;outline:none}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:24px}
.login-box{background:#fff;border-radius:20px;padding:44px 36px;max-width:440px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.login-logo{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;text-align:center;margin-bottom:8px;color:#1a1a2e}
.login-logo span{color:var(--primary)}
.login-sub{text-align:center;color:var(--text-light);font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
.form-group input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;transition:border .2s}
.form-group input:focus{border-color:var(--primary)}
.login-btn{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;margin-top:8px}
.login-btn:hover:not(:disabled){background:var(--primary-dark)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}
.login-error{background:#fee;color:#c00;padding:12px 16px;border-radius:8px;font-size:13.5px;margin-bottom:16px;display:none}
.login-error.show{display:block}
.login-footer{text-align:center;margin-top:20px;font-size:14px;color:var(--text-light)}
.login-footer a{color:var(--primary);font-weight:600}

/* ============ APP LAYOUT ============ */
.app{display:none;min-height:100vh}
.app.active{display:grid;grid-template-columns:260px 1fr}
.sidebar{background:#1e293b;color:#fff;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 24px 24px;font-size:22px;font-weight:800;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand span{color:#818cf8}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;color:#94a3b8;font-weight:500;font-size:14.5px;transition:all .2s;cursor:pointer}
.sidebar nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.sidebar nav a.active{background:var(--primary);color:#fff}
.sidebar nav a .icon{font-size:18px;width:22px;text-align:center}
.main{padding:32px 40px;overflow-y:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap;gap:16px}
.topbar h1{font-size:28px;color:#1a1a2e}
.topbar .user{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--text-light)}
.topbar .user .avatar{width:36px;height:36px;background:var(--primary);color:#fff;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px}
.menu-btn{display:none;background:var(--primary);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600}

/* ============ STATS ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:32px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px}
.stat-card .label{font-size:13px;color:var(--text-light);font-weight:500;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:800;color:#1a1a2e}
.stat-card .icon{float:right;font-size:26px;opacity:.5}

/* ============ CARDS & TABLES ============ */
.card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:24px}
.card-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.card-head h2{font-size:18px;color:#1a1a2e}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;font-weight:600;color:#334155;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:#f8fafc}
td .title-cell{font-weight:600;color:#1a1a2e;display:block;margin-bottom:3px}
td .sub{font-size:12.5px;color:#94a3b8}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty-state{padding:60px;text-align:center;color:#94a3b8}
.loading{padding:60px;text-align:center;color:#94a3b8}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ EDITOR ============ */
.editor-grid{display:grid;grid-template-columns:1fr 320px;gap:24px}
.editor-main{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px}
.editor-side{background:#fff;border:1px solid var(--border);border-radius:14px;padding:24px;height:fit-content;position:sticky;top:24px}
.editor-main input[type=text],.editor-main textarea,.editor-side input,.editor-side select,.editor-side textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;margin-bottom:14px;background:#fff;color:#1a1a2e}
.editor-main input.title-input{font-size:22px;font-weight:700;padding:16px;margin-bottom:16px}
.editor-main textarea{min-height:80px;resize:vertical}
#editor-container{min-height:400px;font-size:15px}
.ql-toolbar{border-radius:10px 10px 0 0;border-color:var(--border)!important}
.ql-container{border-radius:0 0 10px 10px;border-color:var(--border)!important;font-family:'Inter',sans-serif;font-size:15px}
.editor-side h3{font-size:15px;margin:20px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border);color:#1a1a2e}
.editor-side h3:first-child{margin-top:0}
.editor-side label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
.cover-preview{margin-top:10px;border-radius:10px;overflow:hidden;display:none}
.cover-preview img{width:100%;display:block}
.cover-preview.show{display:block}
.upload-btn{padding:10px 16px;background:#f1f5f9;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:inline-block;transition:all .2s}
.upload-btn:hover{background:#e2e8f0}
.hint{font-size:12px;color:var(--text-light);margin-top:-8px;margin-bottom:14px}

/* ============ MODAL ============ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;place-items:center;padding:24px}
.modal-overlay.active{display:grid}
.modal{background:#fff;border-radius:16px;padding:32px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:22px;margin-bottom:20px;color:#1a1a2e}
.modal .close{float:right;font-size:24px;color:#94a3b8;background:none;line-height:1}
.modal label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#334155}
.modal input,.modal textarea,.modal select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14.5px;font-family:inherit}
.modal textarea{min-height:100px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:2000;transform:translateY(100px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .app.active{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;z-index:100;transition:left .3s;width:260px}
  .sidebar.open{left:0}
  .main{padding:20px}
  .editor-grid{grid-template-columns:1fr}
  .editor-side{position:static}
  .menu-btn{display:block}
}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Sign in to your admin panel</p>
    <div class="login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@blog.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
    </form>
    <div class="login-footer">
      Don't have an account? <a href="#" onclick="showRegister();return false">Register</a>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">Ink<span>Well</span> Admin</div>
    <nav>
      <a data-page="dashboard" class="active"><span class="icon">📊</span> Dashboard</a>
      <a data-page="posts"><span class="icon">📝</span> Posts</a>
      <a data-page="new-post"><span class="icon">➕</span> New Post</a>
      <a data-page="comments"><span class="icon">💬</span> Comments</a>
      <a data-page="categories"><span class="icon">📂</span> Categories</a>
      <a data-page="ads"><span class="icon">📢</span> Ads</a>
      <a data-page="subscribers"><span class="icon">📧</span> Subscribers</a>
      <a href="index.html" target="_blank"><span class="icon">🌐</span> View Site</a>
      <a id="logoutBtn"><span class="icon">🚪</span> Logout</a>
    </nav>
  </aside>
  
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="user">
        <div class="avatar" id="userAvatar">A</div>
        <span id="userName">Admin</span>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- ============ MODAL & TOAST ============ -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<!-- ============ QUILL ============ -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  API_URL: 'https://gsssshilla.onrender.com/api/blog',
  UPLOAD_URL: 'https://gsssshilla.onrender.com'
};

let token = localStorage.getItem('token');
let currentUser = JSON.parse(localStorage.getItem('user') || 'null');

// ============================================================
// HELPERS
// ============================================================
const escapeHtml = (s) => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
const formatDateTime = (d) => d ? new Date(d).toLocaleString('en-US',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const imgUrl = (p) => !p ? '' : (p.startsWith('http') ? p : CONFIG.UPLOAD_URL + p);

async function api(endpoint, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (options.body && !(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(CONFIG.API_URL + endpoint, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast ' + type, 3000);
}

// ============================================================
// LOGIN
// ============================================================
document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Signing in...';

  try {
    const res = await fetch(`${CONFIG.API_URL}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');

    token = data.token;
    currentUser = data.user;
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(currentUser));
    initApp();
  } catch(e) {
    err.textContent = e.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
};

function showRegister() {
  const box = document.querySelector('.login-box');
  box.innerHTML = `
    <div class="login-logo">Ink<span>Well</span></div>
    <p class="login-sub">Create your publisher account</p>
    <div class="login-error" id="regError"></div>
    <form id="regForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="regName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
      <div class="form-group"><label>Password (6+ chars)</label><input type="password" id="regPass" required minlength="6"></div>
      <button type="submit" class="login-btn" id="regBtn">Create Account</button>
    </form>
    <div class="login-footer">Already have an account? <a href="#" onclick="location.reload();return false">Sign In</a></div>
  `;
  document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('regBtn');
    const err = document.getElementById('regError');
    btn.disabled = true; btn.textContent = 'Creating...';
    try {
      const res = await fetch(`${CONFIG.API_URL}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPass').value
        })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.error);
      token = data.token; currentUser = data.user;
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(currentUser));
      initApp();
    } catch(e) {
      err.textContent = e.message;
      err.classList.add('show');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  };
}

// ============================================================
// INIT APP
// ============================================================
function initApp() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('userName').textContent = currentUser?.name || 'Admin';
  document.getElementById('userAvatar').textContent = (currentUser?.name || 'A')[0].toUpperCase();
  navigate('dashboard');
}

if (token && currentUser) initApp();

// ============================================================
// NAVIGATION
// ============================================================
document.querySelectorAll('.sidebar nav a[data-page]').forEach(a => {
  a.onclick = () => {
    document.querySelectorAll('.sidebar nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    navigate(a.dataset.page);
    document.getElementById('sidebar').classList.remove('open');
  };
});
document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.toggle('open');

document.getElementById('logoutBtn').onclick = () => {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  location.reload();
};

function setTitle(t) { document.getElementById('pageTitle').textContent = t; }

function navigate(page) {
  const view = document.getElementById('view');
  view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
  switch(page) {
    case 'dashboard': setTitle('Dashboard'); loadDashboard(); break;
    case 'posts': setTitle('All Posts'); loadPosts(); break;
    case 'new-post': setTitle('New Post'); loadEditor(null); break;
    case 'comments': setTitle('Comments'); loadComments(); break;
    case 'categories': setTitle('Categories'); loadCategories(); break;
    case 'ads': setTitle('Ads Manager'); loadAds(); break;
    case 'subscribers': setTitle('Subscribers'); loadSubscribers(); break;
  }
}

// ============================================================
// DASHBOARD
// ============================================================
async function loadDashboard() {
  try {
    const s = await api('/stats');
    document.getElementById('view').innerHTML = `
      <div class="stats">
        <div class="stat-card"><span class="icon">📝</span><div class="label">Total Posts</div><div class="value">${s.posts.total||0}</div></div>
        <div class="stat-card"><span class="icon">✅</span><div class="label">Published</div><div class="value">${s.posts.published||0}</div></div>
        <div class="stat-card"><span class="icon">📄</span><div class="label">Drafts</div><div class="value">${s.posts.drafts||0}</div></div>
        <div class="stat-card"><span class="icon">👁️</span><div class="label">Total Views</div><div class="value">${s.posts.total_views||0}</div></div>
        <div class="stat-card"><span class="icon">💬</span><div class="label">Comments</div><div class="value">${s.comments.total||0}</div></div>
        <div class="stat-card"><span class="icon">❤️</span><div class="label">Likes</div><div class="value">${s.likes||0}</div></div>
        <div class="stat-card"><span class="icon">📧</span><div class="label">Subscribers</div><div class="value">${s.subscribers||0}</div></div>
        <div class="stat-card"><span class="icon">📢</span><div class="label">Ad Impressions</div><div class="value">${s.ads?.impressions||0}</div></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Quick Actions</h2></div>
        <div style="padding:22px;display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="document.querySelector('[data-page=new-post]').click()">➕ Write New Post</button>
          <button class="btn btn-outline" onclick="document.querySelector('[data-page=comments]').click()">💬 Moderate Comments</button>
          <button class="btn btn-outline" onclick="document.querySelector('[data-page=ads]').click()">📢 Manage Ads</button>
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('view').innerHTML = `<div class="empty-state">Failed: ${e.message}</div>`;
  }
}

// ============================================================
// POSTS LIST
// ============================================================
async function loadPosts() {
  try {
    const posts = await api('/posts/admin/all');
    const view = document.getElementById('view');
    if (!posts.length) {
      view.innerHTML = `<div class="card"><div class="empty-state">No posts yet. <a href="#" onclick="document.querySelector('[data-page=new-post]').click();return false" style="color:#6366f1;font-weight:600">Write your first post →</a></div></div>`;
      return;
    }
    view.innerHTML = `
      <div class="card">
        <div class="card-head">
          <h2>All Posts (${posts.length})</h2>
          <button class="btn btn-primary btn-sm" onclick="document.querySelector('[data-page=new-post]').click()">➕ New Post</button>
        </div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Title</th><th>Category</th><th>Status</th><th>Views</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody>
            ${posts.map(p => `
              <tr>
                <td>
                  <span class="title-cell">${escapeHtml(p.title)}</span>
                  <span class="sub">by ${escapeHtml(p.author_name||'Unknown')}</span>
                </td>
                <td>${escapeHtml(p.category_name||'—')}</td>
                <td><span class="badge ${p.status==='published'?'badge-success':'badge-warning'}">${p.status}</span></td>
                <td>${p.views||0}</td>
                <td>${formatDate(p.created_at)}</td>
                <td>
                  <div class="row-actions">
                    <button class="btn btn-outline btn-sm" onclick="loadEditor(${p.id})">✏️ Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  } catch (e) {
    document.getElementById('view').innerHTML = `<div class="empty-state">Failed: ${e.message}</div>`;
  }
}

async function deletePost(id) {
  if (!confirm('Delete this post?')) return;
  try {
    await api(`/posts/${id}`, { method: 'DELETE' });
    toast('Post deleted', 'success');
    loadPosts();
  } catch (e) { toast(e.message, 'error'); }
}

// ============================================================
// EDITOR
// ============================================================
let quill = null;
let editingPostId = null;
let coverUrl = '';
let coverPublicId = '';

async function loadEditor(postId) {
  editingPostId = postId;
  setTitle(postId ? 'Edit Post' : 'New Post');

  // Render editor layout
  document.getElementById('view').innerHTML = `
    <div class="editor-grid">
      <div class="editor-main">
        <input type="text" class="title-input" id="edTitle" placeholder="Post title...">
        <textarea id="edExcerpt" placeholder="Short excerpt (optional)..." style="min-height:80px"></textarea>
        <label style="font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px">Content</label>
        <div id="editor-container"></div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn btn-primary" id="saveBtn">💾 Save Post</button>
          <button class="btn btn-outline" onclick="document.querySelector('[data-page=posts]').click()">Cancel</button>
        </div>
      </div>
      
      <div class="editor-side">
        <h3>Publish</h3>
        <label>Status</label>
        <select id="edStatus">
          <option value="draft">Draft</option>
          <option value="published">Published</option>
        </select>

        <label>Category</label>
        <select id="edCategory"><option value="">— None —</option></select>

        <label style="display:flex;align-items:center;gap:8px;margin-top:14px">
          <input type="checkbox" id="edFeatured" style="width:auto;margin:0"> Featured Post
        </label>

        <h3>Cover Image</h3>
        <input type="file" id="edCoverFile" accept="image/*" style="display:none">
        <label for="edCoverFile" class="upload-btn">📷 Upload Cover</label>
        <div class="cover-preview" id="coverPreview"><img id="coverImg" src=""></div>

        <h3>Tags</h3>
        <label>Comma-separated</label>
        <input type="text" id="edTags" placeholder="tag1, tag2, tag3">

        <h3>SEO</h3>
        <label>Meta Title</label>
        <input type="text" id="edMetaTitle" placeholder="SEO title">
        <label>Meta Description</label>
        <textarea id="edMetaDesc" placeholder="SEO description" style="min-height:70px"></textarea>
      </div>
    </div>
  `;

  // Init Quill
  quill = new Quill('#editor-container', {
    theme: 'snow',
    placeholder: 'Write your story...',
    modules: {
      toolbar: [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        [{ 'align': [] }],
        ['clean']
      ]
    }
  });

  // Custom image handler
  quill.getModule('toolbar').addHandler('image', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.click();
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch(`${CONFIG.API_URL}/upload/content`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: fd
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        const range = quill.getSelection(true);
        quill.insertEmbed(range.index, 'image', data.url);
      } catch(e) { alert('Image upload failed: ' + e.message); }
    };
  });

  // Load categories
  try {
    const cats = await api('/categories');
    const sel = document.getElementById('edCategory');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });
  } catch {}

  // Load existing post if editing
  if(postId) {
    try {
      const post = await api(`/posts/id/${postId}`);
      document.getElementById('edTitle').value = post.title || '';
      document.getElementById('edExcerpt').value = post.excerpt || '';
      document.getElementById('edStatus').value = post.status || 'draft';
      document.getElementById('edCategory').value = post.category_id || '';
      document.getElementById('edFeatured').checked = !!post.featured;
      document.getElementById('edMetaTitle').value = post.meta_title || '';
      document.getElementById('edMetaDesc').value = post.meta_description || '';
      quill.root.innerHTML = post.content || '';
      if(post.tags?.length) document.getElementById('edTags').value = post.tags.map(t=>t.name).join(', ');
      if(post.cover_image) {
        coverUrl = post.cover_image;
        coverPublicId = post.cover_public_id || '';
        document.getElementById('coverImg').src = post.cover_image;
        document.getElementById('coverPreview').classList.add('show');
      }
    } catch(e) { toast('Failed to load: ' + e.message, 'error'); }
  } else {
    coverUrl = ''; coverPublicId = '';
  }

  // Cover upload
  document.getElementById('edCoverFile').onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res = await fetch(`${CONFIG.API_URL}/upload/cover`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: fd
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      coverUrl = data.url;
      coverPublicId = data.public_id;
      document.getElementById('coverImg').src = data.url;
      document.getElementById('coverPreview').classList.add('show');
      toast('Cover uploaded', 'success');
    } catch(e) { toast('Upload failed: ' + e.message, 'error'); }
  };

  document.getElementById('saveBtn').onclick = savePost;
}

async function savePost() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  const content = quill.root.innerHTML;
  const payload = {
    title: document.getElementById('edTitle').value.trim(),
    excerpt: document.getElementById('edExcerpt').value.trim(),
    content: content,
    cover_image: coverUrl,
    cover_public_id: coverPublicId,
    category_id: document.getElementById('edCategory').value || null,
    status: document.getElementById('edStatus').value,
    featured: document.getElementById('edFeatured').checked,
    meta_title: document.getElementById('edMetaTitle').value.trim(),
    meta_description: document.getElementById('edMetaDesc').value.trim(),
    tags: document.getElementById('edTags').value.split(',').map(t=>t.trim()).filter(Boolean)
  };

  if (!payload.title || !content || content === '<p><br></p>') {
    toast('Title and content required', 'error');
    btn.disabled = false; btn.textContent = '💾 Save Post';
    return;
  }

  try {
    if (editingPostId) {
      await api(`/posts/${editingPostId}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Post updated ✅', 'success');
    } else {
      const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
      toast('Post created ✅', 'success');
      editingPostId = r.id;
      setTitle('Edit Post');
    }
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '💾 Save Post'; }
}

// ============================================================
// COMMENTS
// ============================================================
async function loadComments() {
  try {
    const comments = await api('/comments');
    document.getElementById('view').innerHTML = `
      <div class="card">
        <div class="card-head"><h2>Comments (${comments.length})</h2></div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Author</th><th>Comment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody>
            ${comments.length ? comments.map(c => `
              <tr>
                <td><b>${escapeHtml(c.author_name)}</b><div class="sub">${escapeHtml(c.author_email)}</div></td>
                <td style="max-width:300px">${escapeHtml(c.content).slice(0,100)}${c.content.length>100?'...':''}</td>
                <td><span class="badge ${c.status==='approved'?'badge-success':c.status==='spam'?'badge-danger':'badge-warning'}">${c.status}</span></td>
                <td>${formatDate(c.created_at)}</td>
                <td>
                  <div class="row-actions">
                    ${c.status!=='approved' ? `<button class="btn btn-success btn-sm" onclick="setCommentStatus(${c.id},'approved')">✓ Approve</button>`:''}
                    ${c.status!=='spam' ? `<button class="btn btn-outline btn-sm" onclick="setCommentStatus(${c.id},'spam')">🚫 Spam</button>`:''}
                    <button class="btn btn-danger btn-sm" onclick="deleteComment(${c.id})">🗑️</button>
                  </div>
                </td>
              </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center;padding:40px;color:#94a3b8">No comments yet</td></tr>'}
          </tbody>
        </table>
        </div>
      </div>
    `;
  } catch (e) { document.getElementById('view').innerHTML = `<div class="empty-state">${e.message}</div>`; }
}

async function setCommentStatus(id, status) {
  try {
    await api(`/comments/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
    toast('Updated', 'success');
    loadComments();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try { await api(`/comments/${id}`, { method: 'DELETE' }); toast('Deleted', 'success'); loadComments(); } catch(e) { toast(e.message, 'error'); }
}

        <div class="card-head">
          <h2>Categories (${cats.length})</h2>
          <button class="btn btn-primary btn-sm" onclick="showCategoryModal()">➕ New Category</button>
        </div>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Name</th><th>Slug</th><th>Posts</th><th>Actions</th></tr></thead>
          <tbody>
            ${cats.length ? cats.map(c => `
              <tr>
                <td><b>${escapeHtml(c.name)}</b></td>
                <td><code>${escapeHtml(c.slug)}</code></td>
                <td>${c.post_count}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.id})">🗑️</button></td>
              </tr>
            `).join('') : '<tr><td colspan="4" style="text-align:center;padding:40px;color:#94a3b8">No categories</td></tr>'}
          </tbody>
        </table>
        </div>
      </div>
    `;
  } catch (e) { document.getElementById('view').innerHTML = `<div class="empty-state">${e.message}</div>`; }
}

function showCategoryModal() {
  const modal = document.getElementById('modalOverlay');
  document.getElementById('modalContent').innerHTML = `
    <button class="close" onclick="closeModal()">✕</button>
    <h2>New Category</h2>
    <label>Name *</label>
    <input type="text" id="catName" placeholder="e.g. Technology">
    <label>Description</label>
    <textarea id="catDesc" placeholder="Optional description..."></textarea>
    <label>Color</label>
    <input type="color" id="catColor" value="#6366f1" style="height:44px;padding:4px">
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory()">Create</button>
    </div>
  `;
  modal.classList.add('active');
}

async function saveCategory() {
  const name = document.getElementById('catName').value.trim();
  const description = document.getElementById('catDesc').value.trim();
  const color = document.getElementById('catColor').value;
  if (!name) return toast('Name required', 'error');
  try {
    await api('/categories', { method: 'POST', body: JSON.stringify({ name, description, color }) });
    toast('Category created ✅', 'success');
    closeModal();
    loadCategories();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteCategory(id) {
  if (!confirm('Delete this category?')) return;
  try { await api(`/categories/${id}`, { method: 'DELETE' }); toast('Deleted', 'success'); loadCategories(); } catch (e) { toast(e.message, 'error'); }
}

  try {
    await api('/ads', { method: 'POST', body: JSON.stringify(payload) });
    toast('Ad created ✅', 'success');
    closeModal();
    loadAds();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteAd(id) {

  try { await api(`/ads/${id}`, { method: 'DELETE' }); toast('Deleted', 'success'); loadAds(); } catch (e) { toast(e.message, 'error'); }
}
