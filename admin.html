<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — InkWell Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#7c3aed;--primary-dark:#6d28d9;--primary-light:#ede9fe;
  --accent:#ec4899;--accent-2:#f59e0b;
  --text:#0f172a;--text-light:#64748b;--text-muted:#94a3b8;
  --bg:#f8fafc;--bg-card:#fff;--border:#e2e8f0;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;
  --sidebar:#0f172a;--sidebar-text:#94a3b8;
  --gradient:linear-gradient(135deg,#7c3aed 0%,#ec4899 100%);
  --shadow-sm:0 1px 3px rgba(0,0,0,.05);
  --shadow:0 4px 20px rgba(15,23,42,.06);
  --shadow-lg:0 25px 60px rgba(15,23,42,.12);
  --radius:16px;
}
body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none}
a{text-decoration:none;color:inherit}

/* ============ LAYOUT ============ */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  background:var(--sidebar);color:#fff;
  position:fixed;top:0;left:0;height:100vh;width:260px;
  overflow-y:auto;z-index:100;transition:transform .3s;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

.brand{
  padding:24px 24px 20px;font-family:'Fraunces',serif;
  font-size:24px;font-weight:900;letter-spacing:-.5px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:2px;
}
.brand span{
  background:var(--gradient);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}

.nav-section{padding:20px 0 10px}
.nav-label{
  padding:0 24px;font-size:11px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:#475569;margin-bottom:8px;
}
.nav-link{
  display:flex;align-items:center;gap:12px;
  padding:11px 24px;color:var(--sidebar-text);
  font-weight:500;font-size:14.5px;
  transition:all .2s;cursor:pointer;
  border-left:3px solid transparent;
}
.nav-link:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-link.active{
  background:rgba(124,58,237,.15);
  color:#fff;border-left-color:var(--primary);
}
.nav-link .icon{
  width:20px;text-align:center;font-size:16px;
}
.nav-link .badge{
  margin-left:auto;background:var(--danger);color:#fff;
  font-size:11px;padding:2px 8px;border-radius:20px;
  font-weight:700;
}

/* ============ MAIN ============ */
.main{margin-left:260px;padding:32px 40px;min-height:100vh}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:32px;gap:16px;flex-wrap:wrap;
}
.topbar-left{display:flex;align-items:center;gap:16px}
.page-title{
  font-family:'Fraunces',serif;font-size:30px;font-weight:800;
  color:var(--text);letter-spacing:-.5px;
}
.page-subtitle{font-size:14px;color:var(--text-light);margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:12px}

.user-chip{
  display:flex;align-items:center;gap:10px;
  padding:6px 16px 6px 6px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:50px;
  transition:all .2s;
}
.user-chip:hover{box-shadow:var(--shadow)}
.user-chip .avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--gradient);color:#fff;
  display:grid;place-items:center;
  font-weight:700;font-size:14px;
  overflow:hidden;flex-shrink:0;
}
.user-chip .avatar img{width:100%;height:100%;object-fit:cover}
.user-chip .name{font-size:14px;font-weight:600;color:var(--text)}

.menu-btn{
  display:none;width:42px;height:42px;
  background:var(--primary);color:#fff;border-radius:10px;
  font-size:18px;
}

/* ============ BUTTONS ============ */
.btn{
  padding:10px 20px;border-radius:10px;
  font-weight:600;font-size:14px;
  transition:all .2s;display:inline-flex;
  align-items:center;gap:8px;justify-content:center;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 8px 20px rgba(124,58,237,.3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669}
.btn-outline{background:var(--bg-card);border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-icon{padding:8px;width:34px;height:34px;border-radius:8px}

/* ============ CARDS ============ */
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-sm);margin-bottom:24px;
}
.card-head{
  padding:20px 24px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:12px;
}
.card-head h2{
  font-family:'Fraunces',serif;font-size:19px;font-weight:700;
}
.card-body{padding:24px}

/* ============ STATS ============ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;margin-bottom:32px;
}
.stat-card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
  position:relative;overflow:hidden;
  transition:all .3s;
}
.stat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.stat-card::before{
  content:'';position:absolute;top:0;right:0;
  width:100px;height:100px;
  background:radial-gradient(circle,var(--c1,rgba(124,58,237,.15)) 0%,transparent 70%);
  border-radius:50%;transform:translate(30%,-30%);
}
.stat-icon{
  width:48px;height:48px;border-radius:12px;
  display:grid;place-items:center;font-size:22px;
  margin-bottom:16px;
}
.stat-label{font-size:13px;color:var(--text-light);font-weight:500;margin-bottom:6px}
.stat-value{
  font-family:'Fraunces',serif;font-size:32px;font-weight:800;
  color:var(--text);letter-spacing:-1px;line-height:1;
}
.stat-trend{
  font-size:12px;color:var(--success);margin-top:8px;
  display:flex;align-items:center;gap:4px;font-weight:600;
}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  padding:14px 20px;text-align:left;
  background:#f8fafc;font-weight:700;
  color:#334155;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;border-bottom:1px solid var(--border);
}
td{padding:16px 20px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.title-cell{font-weight:600;color:var(--text);display:block;margin-bottom:3px}
.title-cell a:hover{color:var(--primary)}
.sub{font-size:12.5px;color:var(--text-muted)}

.badge{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;letter-spacing:.2px;
}
.badge-success{background:#d1fae5;color:#065f46}
.badge-warning{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-primary{background:var(--primary-light);color:var(--primary)}

.row-actions{display:flex;gap:6px;flex-wrap:wrap}

.thumb{
  width:60px;height:40px;object-fit:cover;
  border-radius:8px;background:#e2e8f0;
}

/* ============ FORMS ============ */
.form-group{margin-bottom:18px}
.form-group label{
  display:block;font-size:13px;font-weight:600;
  color:var(--text);margin-bottom:8px;
}
.form-control{
  width:100%;padding:12px 16px;
  border:2px solid var(--border);border-radius:10px;
  font-size:14.5px;background:var(--bg-card);color:var(--text);
  transition:border .2s;
}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,.1)}
textarea.form-control{resize:vertical;min-height:100px}
select.form-control{cursor:pointer}

/* ============ EDITOR LAYOUT ============ */
.editor-grid{
  display:grid;grid-template-columns:1fr 340px;gap:24px;
}
.editor-main{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
}
.editor-side{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;
  height:fit-content;position:sticky;top:24px;
}
.editor-side h3{
  font-family:'Fraunces',serif;font-size:15px;font-weight:700;
  margin-bottom:16px;padding-bottom:12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}
.title-input{
  width:100%;padding:16px 20px;font-size:22px;font-weight:700;
  border:2px solid var(--border);border-radius:12px;
  margin-bottom:16px;font-family:'Fraunces',serif;
  background:var(--bg-card);color:var(--text);
  transition:border .2s;
}
.title-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,.1)}

#quillEditor{height:500px;font-size:16px;background:#fff;border-radius:0 0 10px 10px}
.ql-toolbar{background:#f8fafc;border-radius:10px 10px 0 0 !important;border-color:var(--border) !important}
.ql-container{border-color:var(--border) !important;font-family:'Plus Jakarta Sans',sans-serif !important;font-size:16px}
.ql-editor{padding:20px}
.ql-editor img{border-radius:10px;margin:14px 0;max-width:100%}

/* ============ IMAGE UPLOAD ============ */
.image-drop{
  border:2px dashed var(--border);border-radius:12px;
  padding:24px;text-align:center;cursor:pointer;
  transition:all .2s;background:#fafafa;
}
.image-drop:hover{border-color:var(--primary);background:var(--primary-light)}
.image-drop.has-image{padding:0;border-style:solid;overflow:hidden;position:relative}
.image-drop input{display:none}
.image-drop .icon{font-size:32px;margin-bottom:8px}
.image-drop .text{font-size:13px;color:var(--text-light)}
.image-drop img{width:100%;height:180px;object-fit:cover;border-radius:10px}
.image-drop .remove{
  position:absolute;top:8px;right:8px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.7);color:#fff;
  display:grid;place-items:center;font-size:16px;cursor:pointer;
}

/* ============ MODAL ============ */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);backdrop-filter:blur(4px);
  z-index:1000;place-items:center;padding:24px;
}
.modal-overlay.active{display:grid;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-card);border-radius:var(--radius);
  max-width:560px;width:100%;max-height:90vh;overflow-y:auto;
  padding:32px;position:relative;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.modal .close{
  position:absolute;top:16px;right:16px;
  width:36px;height:36px;border-radius:50%;
  color:var(--text-muted);font-size:20px;
  display:grid;place-items:center;transition:all .2s;
}
.modal .close:hover{background:#f1f5f9;color:var(--text)}
.modal h2{
  font-family:'Fraunces',serif;font-size:22px;
  margin-bottom:20px;padding-right:40px;
}
.modal-actions{
  display:flex;gap:10px;justify-content:flex-end;
  margin-top:24px;
}

/* ============ TOAST ============ */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:#0f172a;color:#fff;padding:14px 22px;
  border-radius:12px;font-size:14px;font-weight:500;
  z-index:2000;box-shadow:0 20px 50px rgba(0,0,0,.3);
  transform:translateY(120px);opacity:0;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  display:flex;align-items:center;gap:10px;
}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.warning{background:var(--warning)}

/* ============ LOADER ============ */
.loader{text-align:center;padding:60px;color:var(--text-muted)}
.spinner{
  width:40px;height:40px;border:3px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.empty-state{
  text-align:center;padding:80px 24px;color:var(--text-muted);
}
.empty-state .icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty-state h3{
  font-family:'Fraunces',serif;font-size:20px;
  color:var(--text);margin-bottom:8px;
}
.empty-state p{font-size:14px;margin-bottom:24px}

/* ============ COMMENTS ============ */
.comment-card{
  padding:20px;border:1px solid var(--border);
  border-radius:12px;margin-bottom:14px;
  transition:all .2s;
}
.comment-card:hover{box-shadow:var(--shadow)}
.comment-header{
  display:flex;justify-content:space-between;
  align-items:flex-start;margin-bottom:12px;gap:12px;
}
.comment-author{font-weight:700;font-size:14.5px;color:var(--text)}
.comment-email{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.comment-text{
  font-size:14.5px;color:var(--text);line-height:1.6;
  padding:14px;background:#f8fafc;border-radius:10px;
  margin-bottom:12px;
}
.comment-meta{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  font-size:12.5px;color:var(--text-muted);
}

/* ============ TABS (mobile) ============ */
.page{display:none}
.page.active{display:block;animation:fadeInUp .3s}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============ SIDEBAR OVERLAY (mobile) ============ */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:99;
}
.overlay.active{display:block}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:20px}
  .menu-btn{display:grid;place-items:center}
  .editor-grid{grid-template-columns:1fr}
  .editor-side{position:static}
  .page-title{font-size:24px}
}

@media(max-width:640px){
  .main{padding:16px}
  .card-head{padding:16px}
  .card-body{padding:16px}
  th,td{padding:10px 12px}
  .topbar{gap:12px}
  .user-chip .name{display:none}
  .stat-value{font-size:26px}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">Ink<span>Well</span></div>

    <div class="nav-section">
      <div class="nav-label">Main</div>
      <div class="nav-link active" data-page="dashboard">
        <span class="icon">📊</span> Dashboard
      </div>
      <div class="nav-link" data-page="posts">
        <span class="icon">📝</span> All Posts
      </div>
      <div class="nav-link" data-page="editor">
        <span class="icon">✍️</span> New Post
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Manage</div>
      <div class="nav-link" data-page="categories">
        <span class="icon">📂</span> Categories
      </div>
      <div class="nav-link" data-page="comments">
        <span class="icon">💬</span> Comments
        <span class="badge" id="pendingBadge" style="display:none">0</span>
      </div>
      <div class="nav-link" data-page="ads">
        <span class="icon">📢</span> Ads
      </div>
      <div class="nav-link" data-page="subscribers">
        <span class="icon">📧</span> Subscribers
      </div>
    </div>

    <div class="nav-section">
      <div class="nav-label">Account</div>
      <div class="nav-link" data-page="profile">
        <span class="icon">👤</span> Profile
      </div>
      <a class="nav-link" href="../index.html" target="_blank">
        <span class="icon">🌐</span> View Site
      </a>
      <div class="nav-link" id="logoutBtn">
        <span class="icon">🚪</span> Logout
      </div>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <div class="page-title" id="pageTitle">Dashboard</div>
          <div class="page-subtitle" id="pageSubtitle">Welcome back to your blog</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="user-chip">
          <div class="avatar" id="userAvatar">A</div>
          <span class="name" id="userName">Admin</span>
        </div>
      </div>
    </div>

    <!-- Pages -->
    <div class="page active" id="page-dashboard"></div>
    <div class="page" id="page-posts"></div>
    <div class="page" id="page-editor"></div>
    <div class="page" id="page-categories"></div>
    <div class="page" id="page-comments"></div>
    <div class="page" id="page-ads"></div>
    <div class="page" id="page-subscribers"></div>
    <div class="page" id="page-profile"></div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const API = 'https://gsssshilla.onrender.com/api';
const UPLOAD = 'https://gsssshilla.onrender.com';

let TOKEN = localStorage.getItem('admin_token');
let USER = JSON.parse(localStorage.getItem('admin_user') || 'null');
let quill = null;
let editingPostId = null;
let currentImagePublicId = null;

// ============================================================
// HELPERS
// ============================================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const escapeHtml = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
const formatDateTime = (d) => d ? new Date(d).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const imgUrl = (p) => !p ? '' : (p.startsWith('http') ? p : UPLOAD + p);
const initials = (n) => (n || 'A').split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();

async function api(endpoint, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (options.body && !(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;

  const res = await fetch(API + endpoint, { ...options, headers });

  if (res.status === 401) {
    localStorage.removeItem('admin_token');
    localStorage.removeItem('admin_user');
    window.location.href = 'login.html';
    throw new Error('Session expired');
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast ' + type, 3000);
}

// ============================================================
// INIT
// ============================================================
if (!TOKEN) {
  window.location.href = 'login.html';
} else {
  if (USER) {
    $('#userName').textContent = USER.name || 'Admin';
    $('#userAvatar').textContent = initials(USER.name);
  }
  initNav();
  loadDashboard();
  loadPendingCount();
}

// ============================================================
// NAVIGATION
// ============================================================
const pageTitles = {
  dashboard: ['Dashboard', 'Welcome back to your blog'],
  posts: ['All Posts', 'Manage all your articles'],
  editor: ['New Post', 'Create and publish a new article'],
  categories: ['Categories', 'Organize your content'],
  comments: ['Comments', 'Moderate reader discussions'],
  ads: ['Ads Manager', 'Manage ad slots across site'],
  subscribers: ['Subscribers', 'Your newsletter audience'],
  profile: ['Profile', 'Manage your account']
};

function initNav() {
  $$('.nav-link[data-page]').forEach(link => {
    link.onclick = () => navigate(link.dataset.page);
  });

  $('#logoutBtn').onclick = () => {
    if (confirm('Logout?')) {
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
      window.location.href = 'login.html';
    }
  };

  $('#menuBtn').onclick = () => {
    $('#sidebar').classList.add('open');
    $('#overlay').classList.add('active');
  };
  $('#overlay').onclick = () => {
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('active');
  };
}

function navigate(page) {
  $$('.nav-link[data-page]').forEach(l => l.classList.toggle('active', l.dataset.page === page));
  $$('.page').forEach(p => p.classList.remove('active'));
  $(`#page-${page}`).classList.add('active');

  const [title, subtitle] = pageTitles[page] || ['Dashboard', ''];
  $('#pageTitle').textContent = title;
  $('#pageSubtitle').textContent = subtitle;

  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('active');

  const loaders = {
    dashboard: loadDashboard,
    posts: loadPosts,
    editor: () => loadEditor(),
    categories: loadCategories,
    comments: loadComments,
    ads: loadAds,
    subscribers: loadSubscribers,
    profile: loadProfile
  };
  if (loaders[page]) loaders[page]();
}

function initQuill() {
  quill = new Quill('#quillEditor', {
    theme: 'snow',
    placeholder: 'Write your story here...',
    modules: {
      toolbar: {
        container: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['blockquote', 'code-block'],
          [{ align: [] }],
          ['link', 'image', 'video'],
          [{ color: [] }, { background: [] }],
          ['clean']
        ],
        handlers: {
          image: imageHandler
        }
      }
    }
  });
}

function imageHandler() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;

    const range = quill.getSelection(true);
    quill.insertEmbed(range.index, 'image', '⏳ Uploading...');
    quill.setSelection(range.index + 1);

    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch(`${API}/upload/content`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${TOKEN}` },
        body: fd
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      quill.deleteText(range.index, 1);
      quill.insertEmbed(range.index, 'image', data.url);
      quill.setSelection(range.index + 1);
      toast('Image uploaded', 'success');
    } catch (e) {
      quill.deleteText(range.index, 1);
      toast('Upload failed: ' + e.message, 'error');
    }
  };
  input.click();
}

function initCoverUpload() {
  const drop = $('#coverDrop');
  const input = $('#coverFile');

  drop.onclick = (e) => {
    if (e.target.classList.contains('remove')) return;
    input.click();
  };

  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    $('#coverContent').innerHTML = '<div class="icon">⏳</div><div class="text">Uploading...</div>';

    try {
      const fd = new FormData();
      fd.append('file', file);
      const res = await fetch(`${API}/upload/cover`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${TOKEN}` },
        body: fd
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      currentImagePublicId = data.public_id;
      drop.classList.add('has-image');
      $('#coverContent').innerHTML = `
        <img src="${data.url}" alt="Cover">
        <div class="remove" onclick="removeCover(event)">✕</div>
      `;
      drop.dataset.url = data.url;
      drop.dataset.publicId = data.public_id;
      toast('Cover uploaded', 'success');
    } catch (e) {
      $('#coverContent').innerHTML = '<div class="icon">❌</div><div class="text">Upload failed</div>';
      toast(e.message, 'error');
    }
  };
}

function removeCover(e) {
  e.stopPropagation();
  const drop = $('#coverDrop');
  drop.classList.remove('has-image');
  drop.dataset.url = '';
  drop.dataset.publicId = '';
  currentImagePublicId = null;
  $('#coverContent').innerHTML = `
    <div class="icon">📷</div>
    <div class="text">Click to upload cover<br><small>JPEG, PNG, WebP (max 8MB)</small></div>
  `;
  $('#coverFile').value = '';
}

async function loadPostIntoEditor(id) {
  try {
    const post = await api(`/posts/id/${id}`);

    $('#edTitle').value = post.title || '';
    $('#edExcerpt').value = post.excerpt || '';
    $('#edStatus').value = post.status || 'draft';
    $('#edFeatured').value = post.featured ? 'true' : 'false';
    $('#edCategory').value = post.category_id || '';
    $('#edTags').value = (post.tags || []).map(t => t.name).join(', ');
    $('#edMetaTitle').value = post.meta_title || '';
    $('#edMetaDesc').value = post.meta_description || '';

    if (post.content) quill.root.innerHTML = post.content;

    if (post.cover_image) {
      const drop = $('#coverDrop');
      drop.classList.add('has-image');
      drop.dataset.url = post.cover_image;
      drop.dataset.publicId = post.cover_public_id || '';
      currentImagePublicId = post.cover_public_id;
      $('#coverContent').innerHTML = `
        <img src="${imgUrl(post.cover_image)}" alt="Cover">
        <div class="remove" onclick="removeCover(event)">✕</div>
      `;
    }
  } catch (e) {
    toast('Failed to load post: ' + e.message, 'error');
  }
}

async function savePost() {
  const btn = $('#saveBtn');
  btn.disabled = true;
  btn.textContent = '💾 Saving...';

  const payload = {
    title: $('#edTitle').value.trim(),
    excerpt: $('#edExcerpt').value.trim(),
    content: quill.root.innerHTML,
    cover_image: $('#coverDrop').dataset.url || null,
    cover_public_id: $('#coverDrop').dataset.publicId || null,
    category_id: $('#edCategory').value || null,
    status: $('#edStatus').value,
    featured: $('#edFeatured').value === 'true',
    meta_title: $('#edMetaTitle').value.trim() || null,
    meta_description: $('#edMetaDesc').value.trim() || null,
    tags: $('#edTags').value.split(',').map(t => t.trim()).filter(Boolean)
  };

  if (!payload.title || !payload.content || payload.content === '<p><br></p>') {
    toast('Title and content required', 'error');
    btn.disabled = false;
    btn.textContent = '💾 Save Post';
    return;
  }

  try {
    if (editingPostId) {
      await api(`/posts/${editingPostId}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Post updated ✅', 'success');
    } else {
      const r = await api('/posts', { method: 'POST', body: JSON.stringify(payload) });
      toast('Post created ✅', 'success');
      editingPostId = r.id;
    }
    setTimeout(() => { editingPostId = null; navigate('posts'); }, 800);
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Save Post';
  }
}

                <div>
                  <div class="comment-author">${escapeHtml(c.author_name)}</div>
                  <div class="comment-email">${escapeHtml(c.author_email)}</div>
                </div>
                <span class="badge ${c.status === 'approved' ? 'badge-success' : c.status === 'spam' ? 'badge-danger' : 'badge-warning'}">${c.status}</span>
              </div>
              <div class="comment-text">${escapeHtml(c.content)}</div>
              <div class="comment-meta">
                <span>📝 On: <a href="../post.html?slug=${c.post_slug}" target="_blank" style="color:var(--primary)">${escapeHtml(c.post_title || 'Untitled')}</a> · ${formatDateTime(c.created_at)}</span>
                <div class="row-actions">
                  ${c.status !== 'approved' ? `<button class="btn btn-success btn-sm" onclick="setCommentStatus(${c.id}, 'approved')">✓ Approve</button>` : ''}
                  ${c.status !== 'spam' ? `<button class="btn btn-outline btn-sm" onclick="setCommentStatus(${c.id}, 'spam')">🚫 Spam</button>` : ''}
                  <button class="btn btn-danger btn-sm" onclick="deleteComment(${c.id})">🗑️</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
  }
}

async function setCommentStatus(id, status) {
  try {
    await api(`/comments/${id}`, { method: 'PUT', body: JSON.stringify({ status }) });
    toast('Updated', 'success');
    loadComments();
    loadPendingCount();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await api(`/comments/${id}`, { method: 'DELETE' });
    toast('Deleted', 'success');
    loadComments();
    loadPendingCount();
  } catch (e) { toast(e.message, 'error'); }
}

// ============================================================
// ADS
// ============================================================
async function loadAds() {
  const el = $('#page-ads');
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Loading ads...</div>';

  try {
    const ads = await api('/ads');

    el.innerHTML = `
      <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        <div class="stat-card"><div class="stat-label">Total Ads</div><div class="stat-value">${ads.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active</div><div class="stat-value" style="color:#10b981">${ads.filter(a => a.is_active).length}</div></div>
        <div class="stat-card"><div class="stat-label">Impressions</div><div class="stat-value">${ads.reduce((s, a) => s + (a.impressions || 0), 0)}</div></div>
        <div class="stat-card"><div class="stat-label">Clicks</div><div class="stat-value">${ads.reduce((s, a) => s + (a.clicks || 0), 0)}</div></div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>All Ads</h2>
          <button class="btn btn-primary btn-sm" onclick="showAdModal()">➕ New Ad</button>
        </div>
        ${ads.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Position</th><th>Type</th><th>Stats</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${ads.map(a => `
                <tr>
                  <td><b>${escapeHtml(a.name)}</b></td>
                  <td><span class="badge badge-primary">${escapeHtml(a.position)}</span></td>
                  <td><span class="sub">${escapeHtml(a.type)}</span></td>
                  <td><span class="sub">👁️ ${a.impressions || 0} · 🖱️ ${a.clicks || 0}</span></td>
                  <td><span class="badge ${a.is_active ? 'badge-success' : 'badge-danger'}">${a.is_active ? 'Active' : 'Paused'}</span></td>
                  <td>
                    <div class="row-actions">
                      <button class="btn btn-outline btn-sm" onclick='editAd(${JSON.stringify(a).replace(/'/g, "&apos;")})'>✏️</button>
                      <button class="btn btn-danger btn-sm" onclick="deleteAd(${a.id})">🗑️</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>` : `<div class="empty-state"><div class="icon">📢</div><h3>No ads</h3><p>Create your first ad slot</p></div>`}
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
  }
}

function showAdModal(ad = null) {
  const isEdit = !!ad;
  showModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>${isEdit ? 'Edit Ad' : 'New Ad'}</h2>
    <div class="form-group">
      <label>Name *</label>
      <input type="text" class="form-control" id="adName" value="${escapeHtml(ad?.name || '')}" placeholder="e.g. Header Banner">
    </div>
    <div class="form-group">
      <label>Position *</label>
      <select class="form-control" id="adPosition">
        ${['header', 'sidebar', 'in-article', 'footer', 'post-top', 'post-bottom'].map(p => `<option value="${p}" ${ad?.position === p ? 'selected' : ''}>${p}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label>Type *</label>
      <select class="form-control" id="adType" onchange="toggleAdFields()">
        <option value="custom_html" ${ad?.type === 'custom_html' ? 'selected' : ''}>Custom HTML</option>
        <option value="image" ${ad?.type === 'image' ? 'selected' : ''}>Image</option>
        <option value="adsense" ${ad?.type === 'adsense' ? 'selected' : ''}>AdSense Code</option>
      </select>
    </div>
    <div id="adFields"></div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="adActive" ${ad?.is_active !== false ? 'checked' : ''}> Active
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAd(${ad?.id || 'null'})">${isEdit ? 'Update' : 'Create'}</button>
    </div>
  `);

  setTimeout(() => {
    if (ad) {
      $('#adFields').innerHTML = buildAdFields(ad.type);
      $('#adContent').value = ad.content || '';
      if ($('#adImage')) $('#adImage').value = ad.image_url || '';
      if ($('#adLink')) $('#adLink').value = ad.link_url || '';
    } else {
      toggleAdFields();
    }
  }, 30);
}

function buildAdFields(type) {
  return `
    <div class="form-group">
      <label>Content</label>
      <textarea class="form-control" id="adContent" placeholder="${type === 'adsense' ? 'Paste AdSense code...' : 'HTML content...'}" style="min-height:120px"></textarea>
    </div>
    ${type === 'image' ? `
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" class="form-control" id="adImage" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Link URL</label>
        <input type="text" class="form-control" id="adLink" placeholder="https://...">
      </div>
    ` : ''}
  `;
}

function toggleAdFields() {
  const type = $('#adType').value;
  $('#adFields').innerHTML = buildAdFields(type);
}

function editAd(ad) { showAdModal(ad); }

async function saveAd(id) {
  const payload = {
    name: $('#adName').value.trim(),
    position: $('#adPosition').value,
    type: $('#adType').value,
    content: $('#adContent')?.value || '',
    image_url: $('#adImage')?.value || null,
    link_url: $('#adLink')?.value || null,
    is_active: $('#adActive').checked
  };

  if (!payload.name) return toast('Name required', 'error');

  try {
    if (id) {
      await api(`/ads/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
      toast('Ad updated ✅', 'success');
    } else {
      await api('/ads', { method: 'POST', body: JSON.stringify(payload) });
      toast('Ad created ✅', 'success');
    }
    closeModal();
    loadAds();
  } catch (e) { toast(e.message, 'error'); }
}

async function deleteAd(id) {
  if (!confirm('Delete this ad?')) return;
  try {
    await api(`/ads/${id}`, { method: 'DELETE' });
    toast('Deleted', 'success');
    loadAds();
  } catch (e) { toast(e.message, 'error'); }
}

// ============================================================
// SUBSCRIBERS
// ============================================================
async function loadSubscribers() {
  const el = $('#page-subscribers');
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Loading subscribers...</div>';

  try {
    const subs = await api('/subscribers');

    el.innerHTML = `
      <div class="card">
        <div class="card-head">
          <h2>Subscribers (${subs.length})</h2>
          <button class="btn btn-outline btn-sm" onclick="exportSubscribers()">📥 Export CSV</button>
        </div>
        ${subs.length ? `
        <div class="table-wrap">
          <table>
            <thead><tr><th>Email</th><th>Name</th><th>Status</th><th>Subscribed</th><th>Actions</th></tr></thead>
            <tbody>
              ${subs.map(s => `
                <tr>
                  <td><b>${escapeHtml(s.email)}</b></td>
                  <td>${escapeHtml(s.name || '—')}</td>
                  <td><span class="badge ${s.status === 'active' ? 'badge-success' : 'badge-danger'}">${s.status || 'active'}</span></td>
                  <td><span class="sub">${formatDate(s.created_at)}</span></td>
                  <td><button class="btn btn-danger btn-sm" onclick="deleteSubscriber(${s.id})">🗑️</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>` : `<div class="empty-state"><div class="icon">📧</div><h3>No subscribers yet</h3><p>They'll appear here when readers subscribe</p></div>`}
      </div>
    `;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
  }
}

async function deleteSubscriber(id) {
  if (!confirm('Remove this subscriber?')) return;
  try {
    await api(`/subscribers/${id}`, { method: 'DELETE' });
    toast('Removed', 'success');
    loadSubscribers();
  } catch (e) { toast(e.message, 'error'); }
}

function exportSubscribers() {
  const rows = [...$$('#page-subscribers tbody tr')].map(tr => {
    const cells = tr.querySelectorAll('td');
    return [cells[0].innerText, cells[1].innerText, cells[2].innerText, cells[3].innerText];
  });
  const csv = ['Email,Name,Status,Subscribed', ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'subscribers.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported', 'success');
}

// PROFILE
// ============================================================
async function loadProfile() {
  const el = $('#page-profile');
  el.innerHTML = '<div class="loader"><div class="spinner"></div>Loading profile...</div>';

  try {
    const user = await api('/auth/me');

    el.innerHTML = `
      <div class="card">
        <div class="card-head"><h2>Publisher Profile</h2></div>
        <div class="card-body">
          <div style="display:flex;gap:24px;align-items:center;margin-bottom:32px;flex-wrap:wrap">
            <div class="image-drop" id="avatarDrop" style="width:120px;height:120px;border-radius:50%;padding:0;overflow:hidden;position:relative">
              <input type="file" id="avatarFile" accept="image/*">
              ${user.avatar_url
                ? `<img src="${imgUrl(user.avatar_url)}" style="width:100%;height:100%;object-fit:cover">`
                : `<div style="display:grid;place-items:center;height:100%;background:var(--gradient);color:#fff;font-size:36px;font-weight:700">${initials(user.name)}</div>`}
            </div>
            <div>
              <h3 style="font-family:'Fraunces',serif;font-size:22px;margin-bottom:6px">${escapeHtml(user.name)}</h3>
              <p style="color:var(--text-light);font-size:14px">${escapeHtml(user.email)}</p>
              <p style="color:var(--text-muted);font-size:13px;margin-top:4px">Role: <b style="color:var(--primary)">${user.role}</b></p>
            </div>
          </div>

          <div class="form-group">
            <label>Display Name</label>
            <input type="text" class="form-control" id="prName" value="${escapeHtml(user.name || '')}">
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea class="form-control" id="prBio" placeholder="Tell readers about yourself..." style="min-height:100px">${escapeHtml(user.bio || '')}</textarea>
          </div>
          <div class="form-group">
            <label>Website</label>
            <input type="url" class="form-control" id="prWebsite" value="${escapeHtml(user.website || '')}" placeholder="https://yoursite.com">
          </div>
          <div class="form-group">
            <label>Twitter / X</label>
            <input type="text" class="form-control" id="prTwitter" value="${escapeHtml(user.twitter || '')}" placeholder="@username">
          </div>
          <div class="form-group">
            <label>LinkedIn</label>
            <input type="text" class="form-control" id="prLinkedin" value="${escapeHtml(user.linkedin || '')}" placeholder="linkedin.com/in/username">
          </div>

          <div style="display:flex;gap:10px;margin-top:20px">
            <button class="btn btn-primary" id="saveProfileBtn">💾 Save Profile</button>
            <button class="btn btn-outline" id="changePwBtn">🔐 Change Password</button>
          </div>
        </div>
      </div>
    `;

    initAvatarUpload();
    $('#saveProfileBtn').onclick = saveProfile;
    $('#changePwBtn').onclick = showChangePasswordModal;
  } catch (e) {
    el.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${e.message}</p></div>`;
  }
}

function initAvatarUpload() {
  const drop = $('#avatarDrop');
  const input = $('#avatarFile');

  drop.onclick = () => input.click();

  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    try {
      const fd = new FormData();
      fd.append('avatar', file);
      const res = await fetch(`${API}/auth/avatar`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${TOKEN}` },
        body: fd
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      drop.innerHTML = `<input type="file" id="avatarFile" accept="image/*"><img src="${data.url}" style="width:100%;height:100%;object-fit:cover">`;
      initAvatarUpload();
      toast('Avatar updated ✅', 'success');

      USER = { ...USER, avatar_url: data.url };
      localStorage.setItem('admin_user', JSON.stringify(USER));
      $('#userAvatar').innerHTML = `<img src="${data.url}" style="width:100%;height:100%;object-fit:cover">`;
    } catch (e) { toast(e.message, 'error'); }
  };
}

async function saveProfile() {
  const btn = $('#saveProfileBtn');
  btn.disabled = true;
  btn.textContent = '💾 Saving...';

  try {
    await api('/auth/profile', {
      method: 'PUT',
      body: JSON.stringify({
        name: $('#prName').value.trim(),
        bio: $('#prBio').value.trim(),
        website: $('#prWebsite').value.trim(),
        twitter: $('#prTwitter').value.trim(),
        linkedin: $('#prLinkedin').value.trim()
      })
    });
    toast('Profile updated ✅', 'success');
    USER.name = $('#prName').value.trim();
    localStorage.setItem('admin_user', JSON.stringify(USER));
    $('#userName').textContent = USER.name;
  } catch (e) { toast(e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '💾 Save Profile'; }
}

function showChangePasswordModal() {
  showModal(`
    <button class="close" onclick="closeModal()">✕</button>
    <h2>Change Password</h2>
    <div class="form-group">
      <label>Current Password</label>
      <input type="password" class="form-control" id="pwCurrent">
    </div>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" class="form-control" id="pwNew">
    </div>
    <div class="form-group">
      <label>Confirm New Password</label>
      <input type="password" class="form-control" id="pwConfirm">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="changePassword()">Change</button>
    </div>
  `);
}

async function changePassword() {
  const c = $('#pwCurrent').value;
  const n = $('#pwNew').value;
  const cf = $('#pwConfirm').value;

  if (!c || !n) return toast('All fields required', 'error');
  if (n.length < 6) return toast('Password must be 6+ chars', 'error');
  if (n !== cf) return toast('Passwords do not match', 'error');

  try {
    await api('/auth/password', {
      method: 'PUT',
      body: JSON.stringify({ current_password: c, new_password: n })
    });
    toast('Password updated ✅', 'success');
    closeModal();
  } catch (e) { toast(e.message, 'error'); }
}

// ============================================================
// MODAL
// ============================================================
function showModal(html) {
  $('#modalContent').innerHTML = html;
  $('#modalOverlay').classList.add('active');
}
function closeModal() {
  $('#modalOverlay').classList.remove('active');
}
$('#modalOverlay').onclick = (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
};

// Escape closes modal
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});
</script>
