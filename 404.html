<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | InkWell</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--text:#1a1a2e;--text-light:#64748b;--bg:#fff;--bg-soft:#f8fafc;--border:#e2e8f0}
body.dark{--text:#f1f5f9;--text-light:#94a3b8;--bg:#0f172a;--bg-soft:#1e293b;--border:#334155}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s;display:grid;place-items:center;min-height:100vh;padding:24px}
.error{text-align:center;max-width:500px}
.error .code{font-family:'Playfair Display',serif;font-size:clamp(100px,20vw,180px);font-weight:900;color:var(--primary);line-height:1;letter-spacing:-5px}
.error h1{font-family:'Playfair Display',serif;font-size:32px;margin:16px 0 12px}
.error p{color:var(--text-light);font-size:16px;margin-bottom:32px}
.btn{padding:14px 32px;border-radius:50px;font-weight:600;font-size:15px;cursor:pointer;border:none;transition:all .2s;display:inline-block;background:var(--primary);color:#fff;text-decoration:none;font-family:inherit}
.btn:hover{background:#4f46e5;transform:translateY(-2px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);margin-left:8px}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:transparent}
</style>
</head>
<body>

<div class="error">
  <div class="code">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <a href="index.html" class="btn">← Go Home</a>
  <a href="category.html" class="btn btn-outline">Browse Articles</a>
</div>

<script>
if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
</script>

</body>
</html>
