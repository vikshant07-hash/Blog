<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — InkWell</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#6366f1;--primary-dark:#4f46e5;--text:#1a1a2e;--text-light:#64748b}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:grid;place-items:center;padding:24px}
.box{background:#fff;border-radius:20px;padding:44px 36px;max-width:440px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.logo{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;text-align:center;margin-bottom:8px;color:#1a1a2e}
.logo span{color:var(--primary)}
.subtitle{text-align:center;color:var(--text-light);font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#334155}
input{width:100%;padding:13px 16px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
input:focus{border-color:var(--primary)}
button{width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:8px}
button:hover:not(:disabled){background:var(--primary-dark)}
button:disabled{opacity:.6;cursor:not-allowed}
.error{background:#fee;color:#c00;padding:12px 16px;border-radius:8px;font-size:13.5px;margin-bottom:16px;display:none}
.error.show{display:block}
.footer-link{text-align:center;margin-top:20px;font-size:14px;color:var(--text-light)}
.footer-link a{color:var(--primary);font-weight:600}
</style>
</head>
<body>

<div class="box">
  <div class="logo">Ink<span>Well</span></div>
  <p class="subtitle">Create your publisher account</p>
  <div class="error" id="error"></div>
  <form id="regForm">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label>Password (min 6 chars)</label>
      <input type="password" id="password" placeholder="••••••••" required minlength="6">
    </div>
    <button type="submit" id="submitBtn">Create Account</button>
  </form>
  <div class="footer-link">Already have an account? <a href="login.html">Sign In</a></div>
</div>

<script>
const CONFIG = { API_URL: 'https://gsssshilla.onrender.com/api/blog' };

document.getElementById('regForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('error');
  err.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Creating...';

  try {
    const res = await fetch(`${CONFIG.API_URL}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Registration failed');
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'admin.html';
  } catch(e) {
    err.textContent = e.message;
    err.classList.add('show');
  } finally {
    btn.disabled = false; btn.textContent = 'Create Account';
  }
};
</script>
</body>
</html>
