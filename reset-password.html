<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — InkWell</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);padding:24px}
.card{background:#fff;border-radius:20px;padding:36px 28px;max-width:420px;width:100%;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.logo{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;text-align:center;margin-bottom:6px}
.logo span{color:#4f46e5}
.sub{text-align:center;color:#6b7280;font-size:14px;margin-bottom:26px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:15px;margin-bottom:14px;font-family:inherit}
input:focus{outline:none;border-color:#4f46e5}
button{width:100%;padding:13px;background:#4f46e5;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
button:hover{background:#4338ca}
button:disabled{opacity:.6;cursor:not-allowed}
.alert{padding:12px;border-radius:10px;font-size:13.5px;margin-bottom:14px;display:none}
.alert.show{display:block}
.alert.error{background:#fef2f2;color:#b91c1c}
.alert.success{background:#ecfdf5;color:#065f46}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Ink<span>Well</span></div>
  <p class="sub">Set your new password</p>
  <div class="alert error" id="err"></div>
  <div class="alert success" id="ok"></div>
  <form id="form">
    <label>New Password</label>
    <input type="password" id="password" minlength="6" required placeholder="Minimum 6 characters">
    <button type="submit" id="btn">Reset Password</button>
  </form>
</div>
<script>
const CONFIG = { API_URL: 'https://gsssshilla.onrender.com/api/blog' };
const token = new URLSearchParams(location.search).get('token');
const err = document.getElementById('err');
const ok = document.getElementById('ok');

if (!token) {
  err.textContent = 'Invalid reset link';
  err.classList.add('show');
}

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  err.classList.remove('show'); ok.classList.remove('show');
  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    const res = await fetch(`${CONFIG.API_URL}/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    ok.textContent = '✓ Password reset! Redirecting to login...';
    ok.classList.add('show');
    setTimeout(() => location.href = 'admin.html', 2000);
  } catch(e) {
    err.textContent = e.message;
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Reset Password';
  }
};
</script>
</body>
</html>
